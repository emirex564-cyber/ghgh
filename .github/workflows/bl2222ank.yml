# Vostro 3520 - CS8409HDA (henriquejsza/VostroXe): Dell Vostro 3520 icin yazilmis ses surucusu + XeSpeakers eklentisi
# Kullanim: repo > .github/workflows/cs8409hda.yml > Actions > CS8409HDA Vostro > Run workflow
name: CS8409HDA Vostro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Kaynak
        run: |
          git clone -q --depth 1 https://github.com/henriquejsza/VostroXe src
          cd src && git log -1 --format='%h %ci %s'
      - name: Derle (CS8409HDA.kext + XeSpeakers.driver + cs8409ctl)
        run: |
          cd src
          zsh tools/build-kext.sh CS8409HDA
          mkdir -p tools/build
          clang -arch x86_64 -mmacosx-version-min=11.0 -O2 -Wall -o tools/build/cs8409ctl tools/CS8409HDA/cs8409ctl.c -framework IOKit -framework CoreFoundation
          zsh tools/XeSpeakers/build.sh
          codesign -v tools/build/CS8409HDA.kext && codesign -v tools/build/XeSpeakers.driver
          ls -la tools/build && file tools/build/cs8409ctl tools/build/CS8409HDA.kext/Contents/MacOS/CS8409HDA tools/build/XeSpeakers.driver/Contents/MacOS/XeSpeakers
      - uses: actions/upload-artifact@v4
        with:
          name: cs8409hda
          path: |
            src/tools/build/CS8409HDA.kext
            src/tools/build/XeSpeakers.driver
            src/tools/build/cs8409ctl
