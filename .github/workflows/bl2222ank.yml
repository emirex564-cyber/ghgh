# Vostro 3520 - CS8409Audio (nwrafael) derlemesi: Dell "Warlock MLK" CS8409 icin ozel ses surucusu
# Kullanim: repo > .github/workflows/cs8409audio.yml > Actions > CS8409Audio Vostro > Run workflow
# Cikti: "cs8409audio" artifact -> RELEASE/ ve DEBUG/ (CS8409Audio.kext, CS8409Speakers.driver, hdactl)
name: CS8409Audio Vostro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Kaynak
        run: |
          git clone -q https://github.com/nwrafael/CS8409Audio src
          cd src && git log -1 --format='%h %ci %s'
      - name: Vostro yamasi (HDA aygit adi HDEF olabilir)
        run: |
          cd src
          python3 - <<'PYEOF'
          p='CS8409Audio.cpp'; t=open(p).read()
          a='''        OSDictionary *m = IOService::nameMatching("HDAS");
                  IOService *s = m ? IOService::copyMatchingService(m) : nullptr;
                  OSSafeReleaseNULL(m);'''
          assert t.count(a)==1, 'mapHDAS anchor'
          b='''        IOService *s = nullptr;
                  static const char *const vNames[] = { "HDAS", "HDEF", "pci8086,51c8" };
                  for (unsigned vi = 0; vi < 3 && !s; vi++) {
                      OSDictionary *m = IOService::nameMatching(vNames[vi]);
                      s = m ? IOService::copyMatchingService(m) : nullptr;
                      OSSafeReleaseNULL(m);
                      if (s && !OSDynamicCast(IOPCIDevice, s)) OSSafeReleaseNULL(s);
                  }'''
          t=t.replace(a,b)
          open(p,'w').write(t); print('HDAS/HDEF/pci8086,51c8 arama eklendi')
          PYEOF
          grep -n "vNames" CS8409Audio.cpp
      - name: Derle
        run: |
          cd src
          zsh build.sh dist
          ls -R out | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: cs8409audio
          path: src/out/
