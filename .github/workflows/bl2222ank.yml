  bt:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thegwchr/RealtekBluetoothFirmware
          path: rbf
          persist-credentials: false
      - name: Bluetooth yamasi + derle
        run: |
          cat > rbf_patch.py <<'PYEOF'
          #!/usr/bin/env python3
          """RealtekBluetoothFirmware yamasi: XYLog satirlarini IORegistry'ye de yaz + 0bda:c829 ekle."""
          import plistlib, copy, sys
          root = sys.argv[1]
          log = root + "/RealtekBluetoothFirmware/Log.h"
          s = open(log).read()
          old = '''#define XYLog(fmt, x...)\\
          do\\
          {\\
          IOLog("%s: " fmt, "RealtekFirmware", ##x);\\
          }while(0)'''
          assert s.count(old) == 1, "Log.h makrosu bulunamadi"
          new = '''#include <stdarg.h>
          #include <IOKit/IORegistryEntry.h>
          #include <libkern/OSAtomic.h>
          inline void vostroBTRecord(const char *fmt, ...) {
              static volatile SInt32 seq = 0;
              char line[240]; va_list ap; va_start(ap, fmt); vsnprintf(line, sizeof(line), fmt, ap); va_end(ap);
              for (char *c = line; *c; ++c) if (*c == '\\n') *c = ' ';
              const SInt32 n = OSIncrementAtomic(&seq);
              IORegistryEntry *r = IORegistryEntry::getRegistryRoot(); if (!r) return;
              char key[32];
              if (n < 64) { snprintf(key, sizeof(key), "VostroBT%02d", (int)n); r->setProperty(key, line); }
              r->setProperty("VostroBTLast", line);
          }
          #define XYLog(fmt, x...)\\
          do\\
          {\\
          IOLog("%s: " fmt, "RealtekFirmware", ##x);\\
          vostroBTRecord(fmt, ##x);\\
          }while(0)'''
          s = s.replace(old, new)
          open(log, "w").write(s)

          p = root + "/RealtekBluetoothFirmware/Info.plist"
          d = plistlib.load(open(p, "rb"))
          pers = d["IOKitPersonalities"]
          key = "RealtekBluetoothFirmware_0bda_c829"
          if key not in pers:
              tmpl = next(v for k, v in pers.items() if k.startswith("RealtekBluetoothFirmware_0bda_"))
              n = copy.deepcopy(tmpl); n["idVendor"] = 0x0bda; n["idProduct"] = 0xc829; pers[key] = n
          plistlib.dump(d, open(p, "wb"))

          # Sicak yeniden baslatma: firmware zaten yukluyse (lmp_subver tabloda yok) Linux btrtl gibi devam et
          bt = root + "/RealtekBluetoothFirmware/BtRtl.cpp"
          b = open(bt).read()
          old_b = """    m_icInfo = matchIc(ver.lmp_subver, ver.hci_rev, ver.hci_ver);
              if (!m_icInfo) {
                  XYLog("unsupported controller (lmp_subver %04x hci_rev %04x hci_ver %02x)\\n",
                        ver.lmp_subver, ver.hci_rev, ver.hci_ver);
                  return false;
              }"""
          new_b = """    m_icInfo = matchIc(ver.lmp_subver, ver.hci_rev, ver.hci_ver);
              if (!m_icInfo) {
                  XYLog("unsupported controller (lmp_subver %04x hci_rev %04x hci_ver %02x)\\n",
                        ver.lmp_subver, ver.hci_rev, ver.hci_ver);
                  XYLog("VOSTRO: assuming firmware already loaded, continuing\\n");
                  strlcpy(m_fwName, "preloaded", sizeof(m_fwName));
                  return true;
              }"""
          assert b.count(old_b) == 1, "BtRtl unsupported blogu bulunamadi"
          b = b.replace(old_b, new_b)
          open(bt, "w").write(b)
          print("rbf patched v2")
          PYEOF
          python3 rbf_patch.py rbf
          cd rbf && make
          codesign -f -s - build/RealtekBluetoothFirmware.kext
          mkdir -p ../out && cp -R build/RealtekBluetoothFirmware.kext ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: k-bt
          path: out/

  app:
    runs-on: macos-15
    steps:
      - name: Vostrointosh derle
        run: |
          mkdir -p src && cat > src/Vostrointosh.swift <<'SWEOF'
          // Vostrointosh - Dell Vostro 3520 Hackintosh menu bar araci (macOS 13 Ventura+)
          // Wi-Fi (rtw88ctl), ses cikisi secimi (CoreAudio), Bluetooth/ekran durumu, log alma.
          import SwiftUI
          import AppKit
          import CoreAudio

          // MARK: - Komut calistirma

          @discardableResult
          func shell(_ cmd: String, admin: Bool = false) -> (code: Int32, out: String) {
              let p = Process()
              if admin {
                  let esc = cmd.replacingOccurrences(of: "\\", with: "\\\\").replacingOccurrences(of: "\"", with: "\\\"")
                  p.executableURL = URL(fileURLWithPath: "/usr/bin/osascript")
                  p.arguments = ["-e", "do shell script \"\(esc)\" with administrator privileges"]
              } else {
                  p.executableURL = URL(fileURLWithPath: "/bin/bash")
                  p.arguments = ["-c", cmd]
              }
              var env = ProcessInfo.processInfo.environment
              env["PATH"] = "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:" + (env["PATH"] ?? "")
              p.environment = env
              let pipe = Pipe()
              p.standardOutput = pipe
              p.standardError = pipe
              do { try p.run() } catch { return (-1, "\(error)") }
              let data = pipe.fileHandleForReading.readDataToEndOfFile()
              p.waitUntilExit()
              return (p.terminationStatus, String(data: data, encoding: .utf8) ?? "")
          }

          func q(_ s: String) -> String { "'" + s.replacingOccurrences(of: "'", with: "'\\''") + "'" }

          // MARK: - Wi-Fi (rtw88ctl)

          struct WiFiNet: Identifiable, Hashable {
              let id: String
              let ssid: String
              let rssi: Int
          }

          final class WiFiModel: ObservableObject {
              @Published var nets: [WiFiNet] = []
              @Published var status: [String: String] = [:]
              @Published var busy = false
              @Published var message = ""
              let tool = "rtw88ctl"

              var connectedSSID: String? {
                  guard let s = status["SSID"], s != "(unknown)", !s.isEmpty else { return nil }
                  return (status["State"] ?? "").contains("connected") ? s : nil
              }
              var powerOn: Bool { (status["Power"] ?? "on").contains("on") }
              var rssi: Int? { Int((status["RSSI"] ?? "").components(separatedBy: " ").first ?? "") }

              func run(_ args: String, then: ((String) -> Void)? = nil) {
                  busy = true
                  DispatchQueue.global().async {
                      var r = shell("\(self.tool) \(args)")
                      if r.code != 0 && (r.out.contains("ermission") || r.out.contains("privilege") || r.out.contains("0xe00002c1")) {
                          r = shell("/usr/local/bin/\(self.tool) \(args)", admin: true)
                      }
                      DispatchQueue.main.async {
                          self.busy = false
                          if r.code == -1 || r.out.contains("command not found") {
                              self.message = "rtw88ctl bulunamadi (/usr/local/bin)"
                          }
                          then?(r.out)
                      }
                  }
              }

              func refreshStatus() {
                  run("status") { out in
                      var d: [String: String] = [:]
                      for line in out.split(separator: "\n") {
                          guard let i = line.firstIndex(of: ":") else { continue }
                          let k = line[..<i].trimmingCharacters(in: .whitespaces)
                          let v = line[line.index(after: i)...].trimmingCharacters(in: .whitespaces)
                          d[k] = v
                      }
                      self.status = d
                  }
              }

              func scan() {
                  message = "Taraniyor..."
                  run("scan -w 6") { out in
                      self.nets = WiFiModel.parse(out)
                      self.message = self.nets.isEmpty ? "Ag bulunamadi" : ""
                  }
              }

              // "SSID  BSSID  RSSI" tablosu: BSSID'yi bul, oncesi SSID, sonrasindaki ilk sayi RSSI
              static func parse(_ out: String) -> [WiFiNet] {
                  var best: [String: WiFiNet] = [:]
                  let mac = try! NSRegularExpression(pattern: "([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}")
                  for raw in out.split(separator: "\n") {
                      let line = String(raw)
                      let ns = line as NSString
                      guard let m = mac.firstMatch(in: line, range: NSRange(location: 0, length: ns.length)) else { continue }
                      let ssid = ns.substring(to: m.range.location).trimmingCharacters(in: .whitespaces)
                      let rest = ns.substring(from: m.range.location + m.range.length)
                      let rssi = rest.split(whereSeparator: { $0 == " " || $0 == "\t" }).compactMap { Int($0) }.first ?? -100
                      guard !ssid.isEmpty, ssid != "SSID" else { continue }
                      if let old = best[ssid], old.rssi >= rssi { continue }
                      best[ssid] = WiFiNet(id: ssid, ssid: ssid, rssi: rssi)
                  }
                  return best.values.sorted { $0.rssi > $1.rssi }
              }

              func connect(_ ssid: String, _ pass: String) {
                  message = "\(ssid) baglaniyor..."
                  let cmd = pass.isEmpty ? "connect \(q(ssid))" : "connect \(q(ssid)) \(q(pass))"
                  run(cmd) { out in
                      self.message = out.contains("Connected") ? "Baglandi" : "Baglanamadi"
                      if out.contains("Connected") { Keychain.save(ssid: ssid, pass: pass) }
                      self.refreshStatus()
                  }
              }
              func disconnect() { run("disconnect") { _ in self.refreshStatus() } }
              func power(_ on: Bool) { run("power \(on ? "on" : "off")") { _ in self.refreshStatus() } }

              // Acilista bilinen aga otomatik baglan
              func autoJoin() {
                  run("status") { out in
                      if out.contains("connected") && !out.contains("disconnected") { self.refreshStatus(); return }
                      self.run("scan -w 6") { list in
                          self.nets = WiFiModel.parse(list)
                          for n in self.nets { if let p = Keychain.load(ssid: n.ssid) { self.connect(n.ssid, p); return } }
                          self.refreshStatus()
                      }
                  }
              }
          }

          // Sifreler kullanicinin anahtar zincirinde
          enum Keychain {
              static let service = "Vostrointosh.WiFi"
              static func save(ssid: String, pass: String) {
                  let base: [String: Any] = [kSecClass as String: kSecClassGenericPassword,
                                             kSecAttrService as String: service, kSecAttrAccount as String: ssid]
                  SecItemDelete(base as CFDictionary)
                  var add = base; add[kSecValueData as String] = pass.data(using: .utf8)!
                  SecItemAdd(add as CFDictionary, nil)
              }
              static func load(ssid: String) -> String? {
                  let qd: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service,
                                           kSecAttrAccount as String: ssid, kSecReturnData as String: true,
                                           kSecMatchLimit as String: kSecMatchLimitOne]
                  var item: CFTypeRef?
                  guard SecItemCopyMatching(qd as CFDictionary, &item) == errSecSuccess, let d = item as? Data else { return nil }
                  return String(data: d, encoding: .utf8)
              }
          }

          // MARK: - Ses cikisi (CoreAudio)

          struct AudioDev: Identifiable, Hashable { let id: AudioDeviceID; let name: String }

          final class AudioModel: ObservableObject {
              @Published var outputs: [AudioDev] = []
              @Published var current: AudioDeviceID = 0

              func refresh() {
                  var addr = AudioObjectPropertyAddress(mSelector: kAudioHardwarePropertyDevices,
                                                        mScope: kAudioObjectPropertyScopeGlobal,
                                                        mElement: kAudioObjectPropertyElementMain)
                  var size: UInt32 = 0
                  guard AudioObjectGetPropertyDataSize(AudioObjectID(kAudioObjectSystemObject), &addr, 0, nil, &size) == noErr else { return }
                  var ids = [AudioDeviceID](repeating: 0, count: Int(size) / MemoryLayout<AudioDeviceID>.size)
                  guard AudioObjectGetPropertyData(AudioObjectID(kAudioObjectSystemObject), &addr, 0, nil, &size, &ids) == noErr else { return }
                  outputs = ids.filter { AudioModel.hasOutput($0) }.map { AudioDev(id: $0, name: AudioModel.name($0)) }
                  current = AudioModel.defaultOutput()
              }

              static func hasOutput(_ id: AudioDeviceID) -> Bool {
                  var addr = AudioObjectPropertyAddress(mSelector: kAudioDevicePropertyStreamConfiguration,
                                                        mScope: kAudioDevicePropertyScopeOutput,
                                                        mElement: kAudioObjectPropertyElementMain)
                  var size: UInt32 = 0
                  guard AudioObjectGetPropertyDataSize(id, &addr, 0, nil, &size) == noErr, size > 0 else { return false }
                  let raw = UnsafeMutableRawPointer.allocate(byteCount: Int(size), alignment: MemoryLayout<AudioBufferList>.alignment)
                  defer { raw.deallocate() }
                  guard AudioObjectGetPropertyData(id, &addr, 0, nil, &size, raw) == noErr else { return false }
                  let list = UnsafeMutableAudioBufferListPointer(raw.assumingMemoryBound(to: AudioBufferList.self))
                  return list.reduce(0) { $0 + Int($1.mNumberChannels) } > 0
              }

              static func name(_ id: AudioDeviceID) -> String {
                  var addr = AudioObjectPropertyAddress(mSelector: kAudioObjectPropertyName,
                                                        mScope: kAudioObjectPropertyScopeGlobal,
                                                        mElement: kAudioObjectPropertyElementMain)
                  var name: Unmanaged<CFString>?
                  var size = UInt32(MemoryLayout<Unmanaged<CFString>?>.size)
                  guard AudioObjectGetPropertyData(id, &addr, 0, nil, &size, &name) == noErr, let n = name else { return "Cihaz \(id)" }
                  return n.takeRetainedValue() as String
              }

              static func defaultOutput() -> AudioDeviceID {
                  var addr = AudioObjectPropertyAddress(mSelector: kAudioHardwarePropertyDefaultOutputDevice,
                                                        mScope: kAudioObjectPropertyScopeGlobal,
                                                        mElement: kAudioObjectPropertyElementMain)
                  var id: AudioDeviceID = 0
                  var size = UInt32(MemoryLayout<AudioDeviceID>.size)
                  AudioObjectGetPropertyData(AudioObjectID(kAudioObjectSystemObject), &addr, 0, nil, &size, &id)
                  return id
              }

              func select(_ id: AudioDeviceID) {
                  for sel in [kAudioHardwarePropertyDefaultOutputDevice, kAudioHardwarePropertyDefaultSystemOutputDevice] {
                      var addr = AudioObjectPropertyAddress(mSelector: sel, mScope: kAudioObjectPropertyScopeGlobal,
                                                            mElement: kAudioObjectPropertyElementMain)
                      var dev = id
                      AudioObjectSetPropertyData(AudioObjectID(kAudioObjectSystemObject), &addr, 0, nil,
                                                 UInt32(MemoryLayout<AudioDeviceID>.size), &dev)
                  }
                  refresh()
              }
          }

          // MARK: - Sistem durumu (ekran / bluetooth / usb)

          struct StatusLine: Identifiable { let id: String; let value: String }

          final class SystemModel: ObservableObject {
              @Published var lines: [StatusLine] = []
              @Published var logMsg = ""

              func refresh() {
                  DispatchQueue.global().async {
                      var r: [StatusLine] = []
                      let combo = shell("ioreg -lw0 -d 1 | grep -E '\"VostroComboLast\"' | sed 's/.*= //'").out
                          .trimmingCharacters(in: .whitespacesAndNewlines)
                      r.append(StatusLine(id: "Laptop ekrani", value: combo.contains("result=0\"") ? "ACIK" : (combo.isEmpty ? "bilgi yok" : "egitim basarisiz")))
                      let bt = shell("system_profiler SPBluetoothDataType 2>/dev/null | grep -E 'State:|Address:' | head -2").out
                      r.append(StatusLine(id: "Bluetooth", value: bt.contains("On") ? "acik" : (bt.contains("NULL") ? "kart yanit vermiyor" : "kapali")))
                      let usbAudio = shell("system_profiler SPAudioDataType 2>/dev/null | grep -c 'Transport: USB'").out
                          .trimmingCharacters(in: .whitespacesAndNewlines)
                      r.append(StatusLine(id: "USB ses cihazi", value: (Int(usbAudio) ?? 0) > 0 ? "\(usbAudio) adet" : "yok"))
                      let d = shell("cat /Volumes/1401/vostro_durum/bitti.txt /Volumes/1401/vostro_durum/siradaki.txt 2>/dev/null | head -1").out
                          .trimmingCharacters(in: .whitespacesAndNewlines)
                      if !d.isEmpty { r.append(StatusLine(id: "Ekran denemesi", value: d)) }
                      DispatchQueue.main.async { self.lines = r }
                  }
              }

              func takeLog() {
                  logMsg = "Log aliniyor..."
                  DispatchQueue.global().async {
                      let r = shell("bash /usr/local/vostro/vostro_log.sh", admin: true)
                      DispatchQueue.main.async {
                          self.logMsg = r.code == 0 ? "Log 1401/vostro_combo.txt'ye yazildi" : "Log alinamadi"
                          if r.code == 0 { NSWorkspace.shared.selectFile("/Volumes/1401/vostro_combo.txt", inFileViewerRootedAtPath: "") }
                      }
                  }
              }

              // Ventura: Kontrol Merkezi'ndeki yerel Wi-Fi simgesini gizle/goster
              func nativeWiFiIcon(show: Bool) {
                  shell("defaults write com.apple.controlcenter 'NSStatusItem Visible WiFi' -bool \(show ? "true" : "false"); killall ControlCenter")
              }
          }

          // MARK: - Arayuz

          struct WiFiRow: View {
              let net: WiFiNet
              let connected: Bool
              let onTap: () -> Void
              var bars: String { net.rssi > -55 ? "wifi" : (net.rssi > -70 ? "wifi" : "wifi.exclamationmark") }
              var body: some View {
                  Button(action: onTap) {
                      HStack {
                          Image(systemName: bars).frame(width: 18)
                          Text(net.ssid).lineLimit(1)
                          Spacer()
                          if connected { Image(systemName: "checkmark").foregroundColor(.accentColor) }
                          Text("\(net.rssi)").font(.caption).foregroundColor(.secondary)
                      }.contentShape(Rectangle())
                  }.buttonStyle(.plain).padding(.vertical, 2)
              }
          }

          struct MenuView: View {
              @ObservedObject var wifi: WiFiModel
              @ObservedObject var audio: AudioModel
              @ObservedObject var sys: SystemModel
              @State private var pickSSID: String?
              @State private var pass = ""

              var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      HStack {
                          Text("Wi-Fi").font(.headline)
                          Spacer()
                          Toggle("", isOn: Binding(get: { wifi.powerOn }, set: { wifi.power($0) }))
                              .toggleStyle(.switch).labelsHidden()
                      }
                      if let s = wifi.connectedSSID {
                          HStack {
                              Image(systemName: "wifi").foregroundColor(.accentColor)
                              Text(s).bold()
                              Spacer()
                              Button("Kes") { wifi.disconnect() }
                          }
                      }
                      HStack {
                          Text("Diger aglar").font(.caption).foregroundColor(.secondary)
                          Spacer()
                          if wifi.busy { ProgressView().controlSize(.small) }
                          Button { wifi.scan() } label: { Image(systemName: "arrow.clockwise") }.buttonStyle(.borderless)
                      }
                      ScrollView {
                          VStack(alignment: .leading, spacing: 0) {
                              ForEach(wifi.nets) { n in
                                  WiFiRow(net: n, connected: n.ssid == wifi.connectedSSID) {
                                      if let saved = Keychain.load(ssid: n.ssid) { wifi.connect(n.ssid, saved) }
                                      else { pickSSID = n.ssid; pass = "" }
                                  }
                              }
                          }
                      }.frame(maxHeight: 180)
                      if let s = pickSSID {
                          VStack(alignment: .leading) {
                              Text("\"\(s)\" sifresi").font(.caption)
                              SecureField("Sifre (acik ag icin bos)", text: $pass)
                              HStack {
                                  Button("Vazgec") { pickSSID = nil }
                                  Spacer()
                                  Button("Baglan") { wifi.connect(s, pass); pickSSID = nil }.keyboardShortcut(.defaultAction)
                              }
                          }
                      }
                      if !wifi.message.isEmpty { Text(wifi.message).font(.caption).foregroundColor(.secondary) }

                      Divider()
                      Text("Ses cikisi").font(.headline)
                      if audio.outputs.isEmpty {
                          Text("Ses cihazi yok. USB ses karti ya da Bluetooth hoparlor tak.").font(.caption).foregroundColor(.secondary)
                      }
                      ForEach(audio.outputs) { d in
                          Button { audio.select(d.id) } label: {
                              HStack {
                                  Image(systemName: d.id == audio.current ? "speaker.wave.2.fill" : "speaker")
                                  Text(d.name)
                                  Spacer()
                                  if d.id == audio.current { Image(systemName: "checkmark") }
                              }.contentShape(Rectangle())
                          }.buttonStyle(.plain)
                      }

                      Divider()
                      Text("Vostro 3520 durumu").font(.headline)
                      ForEach(sys.lines) { l in
                          HStack { Text(l.id).foregroundColor(.secondary); Spacer(); Text(l.value).lineLimit(2).multilineTextAlignment(.trailing) }
                              .font(.caption)
                      }
                      HStack {
                          Button("Log al") { sys.takeLog() }
                          Button("Bluetooth ayarlari") {
                              NSWorkspace.shared.open(URL(string: "x-apple.systempreferences:com.apple.BluetoothSettings")!)
                          }
                      }
                      if !sys.logMsg.isEmpty { Text(sys.logMsg).font(.caption).foregroundColor(.secondary) }
                      Menu("Diger") {
                          Button("Yerel Wi-Fi simgesini gizle") { sys.nativeWiFiIcon(show: false) }
                          Button("Yerel Wi-Fi simgesini goster") { sys.nativeWiFiIcon(show: true) }
                          Button("Acilista calistir") {
                              shell("osascript -e 'tell application \"System Events\" to make login item at end with properties {path:\"\(Bundle.main.bundlePath)\", hidden:true}'")
                          }
                          Divider()
                          Button("Cikis") { NSApp.terminate(nil) }
                      }
                  }
                  .padding(12)
                  .frame(width: 300)
                  .onAppear { wifi.refreshStatus(); audio.refresh(); sys.refresh(); if wifi.nets.isEmpty { wifi.scan() } }
              }
          }

          @main
          struct VostrointoshApp: App {
              @StateObject var wifi: WiFiModel
              @StateObject var audio = AudioModel()
              @StateObject var sys = SystemModel()

              init() {
                  let w = WiFiModel()
                  _wifi = StateObject(wrappedValue: w)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 3) { w.autoJoin() }
              }

              var icon: String {
                  if !wifi.powerOn { return "wifi.slash" }
                  return wifi.connectedSSID == nil ? "wifi.exclamationmark" : "wifi"
              }

              var body: some Scene {
                  MenuBarExtra {
                      MenuView(wifi: wifi, audio: audio, sys: sys)
                  } label: {
                      Image(systemName: icon)
                  }
                  .menuBarExtraStyle(.window)
              }
          }
          SWEOF
          swiftc -parse-as-library -O -target x86_64-apple-macos13.0 src/Vostrointosh.swift -o Vostrointosh \
            -framework SwiftUI -framework AppKit -framework CoreAudio -framework Security
          A=out/Vostrointosh.app/Contents; mkdir -p $A/MacOS && cp Vostrointosh $A/MacOS/
          cat > $A/Info.plist <<'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
           <key>CFBundleExecutable</key><string>Vostrointosh</string>
           <key>CFBundleIdentifier</key><string>com.vostro.vostrointosh</string>
           <key>CFBundleName</key><string>Vostrointosh</string>
           <key>CFBundlePackageType</key><string>APPL</string>
           <key>CFBundleShortVersionString</key><string>1.0</string>
           <key>CFBundleVersion</key><string>1</string>
           <key>LSMinimumSystemVersion</key><string>13.0</string>
           <key>LSUIElement</key><true/>
          </dict></plist>
          PEOF
          codesign -f -s - out/Vostrointosh.app
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/AppleALC
          ref: ff01db21749271916d44605503499ceaa61d94b2
          path: alc
          persist-credentials: false
      - name: alc-verb derle
        run: |
          clang -O2 -arch x86_64 -mmacosx-version-min=10.13 -I alc/AppleALC -I alc/alc-verb alc/alc-verb/main.c \
            -framework IOKit -framework CoreFoundation -o out/alc-verb
          codesign -f -s - out/alc-verb
      - uses: actions/upload-artifact@v4
        with:
          name: k-app
          path: out/

