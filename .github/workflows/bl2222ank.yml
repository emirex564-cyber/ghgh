# Vostro 3520 - TEK TIK PAKET
# WhateverXe (ekran yamasi) + RealtekBluetoothFirmware (BT yamasi) derlenir,
# kurulum scriptleriyle birlikte vostro-paket.zip olarak verilir.
# Kullanim: repo > .github/workflows/build-vostro-paket.yml > Actions > Build Vostro Paket > Run workflow
name: Build Vostro Paket

on:
  workflow_dispatch:

jobs:
  wex:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe
          ref: "0.8.3"
          path: wex
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: wex/MacKernelSDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: "1.7.2"
          path: lilu
          persist-credentials: false
      - name: Lilu gelistirme dosyalari
        run: |
          mkdir -p wex/Lilu.kext/Contents/Resources
          ln -s "$GITHUB_WORKSPACE/lilu/Lilu/Headers" wex/Lilu.kext/Contents/Resources/Headers
          ln -s "$GITHUB_WORKSPACE/lilu/Lilu/Library" wex/Lilu.kext/Contents/Resources/Library
      - name: Ekran yamasi + derle
        run: |
          cat > wex_patch.py <<'PYEOF'
          #!/usr/bin/env python3
          """Vostro 3520 WhateverXe 0.8.3 yamasi v4: kayit + boot-arg ile sinyal ayari.
            boot-args: vostroswing=0..3  vostroemph=0..3  -vostrolow   (hicbiri yoksa davranis orijinalle ayni)
            python3 wex_patch.py <WhateverXe/kern_xe.cpp>
          Kayitlar IORegistry kokunde: VostroCombo00..47, VostroComboLast, VostroComboCount
          """
          import sys
          path = sys.argv[1]
          s = open(path).read()

          def rep(old, new):
              global s
              assert s.count(old) == 1, "bulunamadi: " + old[:70]
              s = s.replace(old, new)

          helper = """
          static volatile SInt32 vostroSeq=0;
          static void vostroRecord(const char *fmt,...) {
           char line[256];__builtin_va_list ap;__builtin_va_start(ap,fmt);vsnprintf(line,sizeof(line),fmt,ap);__builtin_va_end(ap);
           IOLog("VOSTRO %s\\n",line);
           const SInt32 n=OSIncrementAtomic(&vostroSeq);
           auto root=IORegistryEntry::getRegistryRoot();if(!root)return;
           char key[32];
           if(n<96){snprintf(key,sizeof(key),"VostroCombo%02d",(int)n);root->setProperty(key,line);}
           root->setProperty("VostroComboLast",line);
           root->setProperty("VostroComboCount",(unsigned long long)(n+1),32);
          }
          static volatile uint32_t vostroLastWhy=0xFFFFFFFFU,vostroLastDDI=0xFFFFFFFFU;
          #include <pexpert/pexpert.h>
          struct VostroKnobs {uint32_t swing,emph;bool low;bool loaded;uint32_t tps;bool rev;};
          static VostroKnobs vostroKnobs() {
           static VostroKnobs k {0,0,false,false,0,false};
           if(!k.loaded) {
            uint32_t v=0;
            if(PE_parse_boot_argn("vostroswing",&v,sizeof(v)) && v<=3)k.swing=v;
            v=0;if(PE_parse_boot_argn("vostroemph",&v,sizeof(v)) && v<=3)k.emph=v;
            v=0;if(PE_parse_boot_argn("vostrotps",&v,sizeof(v)) && v>=1 && v<=3)k.tps=v;
            k.low=checkKernelArgument("-vostrolow");k.rev=checkKernelArgument("-vostrorev");k.loaded=true;
            vostroRecord("knobs swing>=%u emph>=%u low=%d tps=%u rev=%d",k.swing,k.emph,(int)k.low,k.tps,(int)k.rev);
           }
           return k;
          }
          """

          # 1) helper'i ilk kullanimdan once koy
          rep("uint32_t XE::wrapDisplay13PortTraining(void *port,void *request) {",
              helper + "uint32_t XE::wrapDisplay13PortTraining(void *port,void *request) {")

          # 2) training wrapper: neden reddedildigini ve sonucu kaydet
          rep(""" IOLockLock(c.lock);auto p=display13SSTPort(port);
           const bool valid=p && p[0x115]==1 && !p[0x117] && p[0x10]<=1 && p[0x11A]<=1;
           if(valid)p[0x11A]&=p[0x10];
           IOLockUnlock(c.lock);if(!valid)return kIOReturnNotReady;
           return FunctionCast(wrapDisplay13PortTraining,s->orgDisplay13PortTraining)(port,request);""",
          """ IOLockLock(c.lock);auto p=display13SSTPort(port);
           const bool valid=p && p[0x115]==1 && !p[0x117] && p[0x10]<=1 && p[0x11A]<=1;
           const unsigned vDDI=p?Display13FBMemory::field<uint32_t>(p,0x120):0xFFU;
           const unsigned v115=p?p[0x115]:0xFFU,v117=p?p[0x117]:0xFFU,v10=p?p[0x10]:0xFFU,v11A=p?p[0x11A]:0xFFU;
           if(valid)p[0x11A]&=p[0x10];
           IOLockUnlock(c.lock);
           if(!valid){vostroRecord("train REFUSED sst=%d ddi=%u f115=%u f117=%u f10=%u f11a=%u",(int)(p!=nullptr),vDDI,v115,v117,v10,v11A);return kIOReturnNotReady;}
           const uint32_t vRes=FunctionCast(wrapDisplay13PortTraining,s->orgDisplay13PortTraining)(port,request);
           vostroRecord("train ddi=%u result=%x",vDDI,vRes);
           return vRes;""")

          # 3) display13SSTPort: hangi kontrolun tutmadigini bit olarak kaydet (davranis ayni)
          rep("""uint8_t *XE::display13SSTPort(void *port) {
           auto s=callbackXE;auto &c=display13FBPower;auto object=static_cast<OSObject *>(port);
           if(!s->display13FramebufferRequested || s->xeProfile.display!=XELP::Display::XeLPD || !s->display13FBSSTHooksReady ||
              !object || object->getMetaClass()->getClassSize()<0x624 || !c.controller ||
              c.controller!=s->adlnTopologyController || !adlnWriterMappingBound() ||
              c.clockFaulted || c.memoryFaulted || c.panelFaulted || c.clockStopped || !s->adlnOutputWiring.described())return nullptr;
           auto p=static_cast<uint8_t *>(port);auto config=Display13FBMemory::field<uint32_t *>(p,0x548);
           if(!Display13FBTopology::selected(s->adlnPlatform,config,s->adlnOutputWiring) ||
              !(s->adlnOutputWiring.links()&(1U<<config[0])) || p[0x117] ||
              Display13FBMemory::field<uint32_t>(p,0x120)!=config[0] ||""",
          """uint8_t *XE::display13SSTPort(void *port) {
           auto s=callbackXE;auto &c=display13FBPower;auto object=static_cast<OSObject *>(port);
           {
            uint32_t why=0;
            if(!s->display13FramebufferRequested)why|=0x1;
            if(s->xeProfile.display!=XELP::Display::XeLPD)why|=0x2;
            if(!s->display13FBSSTHooksReady)why|=0x4;
            if(!object || object->getMetaClass()->getClassSize()<0x624)why|=0x8;
            if(!c.controller || c.controller!=s->adlnTopologyController)why|=0x10;
            if(!adlnWriterMappingBound())why|=0x20;
            if(c.clockFaulted)why|=0x40;
            if(c.memoryFaulted)why|=0x80;
            if(c.panelFaulted)why|=0x100;
            if(c.clockStopped)why|=0x200;
            if(!s->adlnOutputWiring.described())why|=0x400;
            uint32_t ddi=0xFFU,mode=0xFFFFU;
            if(!(why&0x8)) {
             auto pp=static_cast<uint8_t *>(port);auto cfg=Display13FBMemory::field<uint32_t *>(pp,0x548);
             if(!Display13FBTopology::selected(s->adlnPlatform,cfg,s->adlnOutputWiring))why|=0x800;
             else {
              ddi=cfg[0];mode=Display13FBMemory::field<uint32_t>(pp,0x550);
              if(!(s->adlnOutputWiring.links()&(1U<<ddi)))why|=0x1000;
              if(pp[0x117])why|=0x2000;
              if(Display13FBMemory::field<uint32_t>(pp,0x120)!=ddi)why|=0x4000;
              if(ddi>=3 ? mode!=((s->adlnOutputWiring.typeC&(1U<<ddi))?3U:4U) : mode>1U)why|=0x8000;
              if(Display13FBMemory::field<void *>(pp,0x578)!=c.access)why|=0x10000;
             }
            }
            if(why!=vostroLastWhy || ddi!=vostroLastDDI) {
             vostroLastWhy=why;vostroLastDDI=ddi;
             vostroRecord("sst ddi=%u why=%x mode=%u links=%x panel=%x dp=%x described=%d",ddi,why,mode,
              (unsigned)s->adlnOutputWiring.links(),(unsigned)s->adlnOutputWiring.panel,(unsigned)s->adlnOutputWiring.dp,(int)s->adlnOutputWiring.described());
            }
           }
           if(!s->display13FramebufferRequested || s->xeProfile.display!=XELP::Display::XeLPD || !s->display13FBSSTHooksReady ||
              !object || object->getMetaClass()->getClassSize()<0x624 || !c.controller ||
              c.controller!=s->adlnTopologyController || !adlnWriterMappingBound() ||
              c.clockFaulted || c.memoryFaulted || c.panelFaulted || c.clockStopped || !s->adlnOutputWiring.described())return nullptr;
           auto p=static_cast<uint8_t *>(port);auto config=Display13FBMemory::field<uint32_t *>(p,0x548);
           if(!Display13FBTopology::selected(s->adlnPlatform,config,s->adlnOutputWiring) ||
              !(s->adlnOutputWiring.links()&(1U<<config[0])) || p[0x117] ||
              Display13FBMemory::field<uint32_t>(p,0x120)!=config[0] ||""")

          # 4) hook kurulumu: kaydin calistigini acilista dogrula
          rep(""" display13FBSSTHooksReady=patcher.routeMultiple(index,routes,arrsize(routes),address,size);patcher.clearError();
           return display13FBSSTHooksReady;""",
          """ display13FBSSTHooksReady=patcher.routeMultiple(index,routes,arrsize(routes),address,size);patcher.clearError();
           vostroRecord("boot sst-hooks=%d",(int)display13FBSSTHooksReady);
           return display13FBSSTHooksReady;""")

          # 5a) sinyal: boot-arg ile minimum swing/emph ve low-swing
          rep("""  if(selected.selectADLP(ddi,Display13FBMemory::field<uint32_t>(p,0x124),Display13FBMemory::field<uint32_t>(p,0x128),swing,emphasis,(s->adlnOutputWiring.panel&(1U<<ddi))!=0,s->firmwarePorts.panel.lowSwing) &&""",
          """  const auto vk=vostroKnobs();
            uint32_t vSw=swing>vk.swing?swing:vk.swing,vEm=emphasis>vk.emph?emphasis:vk.emph;
            if(vSw+vEm>3)vEm=3-vSw;
            if(selected.selectADLP(ddi,Display13FBMemory::field<uint32_t>(p,0x124),Display13FBMemory::field<uint32_t>(p,0x128),vSw,vEm,(s->adlnOutputWiring.panel&(1U<<ddi))!=0,vk.low || s->firmwarePorts.panel.lowSwing) &&""")
          # 5) sinyal fonksiyonu (onceki tani)
          rep(""" if(!s->adlnOutputWiring.links() || display13HDMIPort(port))
            return FunctionCast(wrapDisplay13SignalLevels,s->orgDisplay13SignalLevels)(port,swing,emphasis,overrideConfig);""",
          """ if(!s->adlnOutputWiring.links() || display13HDMIPort(port)) {
            vostroRecord("signal donor-path links=%x swing=%u emph=%u",(unsigned)s->adlnOutputWiring.links(),swing,emphasis);
            return FunctionCast(wrapDisplay13SignalLevels,s->orgDisplay13SignalLevels)(port,swing,emphasis,overrideConfig);
           }""")
          rep("""       [&](uint32_t r,uint32_t v){registers.write(r,v);} ))result=0;
            }
           }
           IOLockUnlock(c.lock);return result;""",
          """       [&](uint32_t r,uint32_t v){registers.write(r,v);} ))result=0;
            }
            vostroRecord("signal ddi=%u lanes=%u rate=%u swing=%u emph=%u used=%u/%u low=%d lvl=%u result=%x",ddi,
             Display13FBMemory::field<uint32_t>(p,0x124),Display13FBMemory::field<uint32_t>(p,0x128),swing,emphasis,vSw,vEm,(int)selected.low,selected.level,result);
           }
           IOLockUnlock(c.lock);return result;""")

          # 6) training pattern (TPS1/2/3/4) kaydi
          rep("""uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {
           auto s=callbackXE;auto &c=display13FBPower;""",
          """uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {
           auto s=callbackXE;auto &c=display13FBPower;
           vostroRecord("pattern %u",pattern);
           if(pattern==4 && vostroKnobs().tps) {pattern=vostroKnobs().tps;vostroRecord("pattern 4 -> %u (vostrotps)",pattern);}""")
          rep(""" if(result || pattern>5)return result;
           return program(false)?0:kIOReturnNotReady;""",""" if(result || pattern>5) {vostroRecord("pattern %u donor-result=%x",pattern,result);return result;}
           const bool vOk=program(false);if(!vOk)vostroRecord("pattern %u framing-fail",pattern);
           return vOk?0:kIOReturnNotReady;""")

          # 7) DPCD/AUX trafigi: panelin ne dedigini gormek icin (lane status 0x202..)
          rep("""uint32_t XE::wrapDisplay13ReadAUX(void *port,uint32_t address,void *data,uint32_t length) {""",
          """static volatile SInt32 vostroDPSeq=0;
          static void vostroDP(char rw,void *port,uint32_t address,const void *data,uint32_t length,uint32_t r) {
           const SInt32 n=OSIncrementAtomic(&vostroDPSeq);if(n>=480)return;
           uint32_t ddi=99;
           if(port){auto cfg=*reinterpret_cast<uint32_t **>(static_cast<uint8_t *>(port)+0x548);if(cfg)ddi=cfg[0];}
           char line[160];int o=snprintf(line,sizeof(line),"%c d%u %04x n%u r%x:",rw,ddi,address,length,r);
           const uint32_t m=length<16?length:16;
           if(data && (rw=='W' || !r))for(uint32_t i=0;i<m && o<(int)sizeof(line)-4;i++)o+=snprintf(line+o,sizeof(line)-o," %02x",static_cast<const uint8_t *>(data)[i]);
           auto root=IORegistryEntry::getRegistryRoot();if(!root)return;
           char key[24];snprintf(key,sizeof(key),"VostroDP%03d",(int)n);root->setProperty(key,line);
          }
          static void vostroDPLine(const char *line) {
           const SInt32 n=OSIncrementAtomic(&vostroDPSeq);if(n>=480)return;
           auto root=IORegistryEntry::getRegistryRoot();if(!root)return;
           char key[24];snprintf(key,sizeof(key),"VostroDP%03d",(int)n);root->setProperty(key,line);
          }
          uint32_t XE::wrapDisplay13ReadAUX(void *port,uint32_t address,void *data,uint32_t length) {""")
          rep(""" const auto r=FunctionCast(wrapDisplay13ReadAUX,callbackXE->orgDisplay13ReadAUX)(port,address,data,length);""",
          """ const auto r=FunctionCast(wrapDisplay13ReadAUX,callbackXE->orgDisplay13ReadAUX)(port,address,data,length);
           vostroDP('R',port,address,data,length,r);""")
          rep(""" if(!ready)return kIOReturnNotReady;
           const auto r=FunctionCast(wrapDisplay13WriteAUX,callbackXE->orgDisplay13WriteAUX)(port,address,data,length);""",
          """ if(!ready){vostroDP('w',port,address,data,length,kIOReturnNotReady);return kIOReturnNotReady;}
           const auto r=FunctionCast(wrapDisplay13WriteAUX,callbackXE->orgDisplay13WriteAUX)(port,address,data,length);
           vostroDP('W',port,address,data,length,r);""")

          # 8) her sinyal ayarindan sonra donanim kayitlari (DDI_BUF_CTL, PHY lane gucu, DP_TP_CTL/STATUS)
          rep("""   if(selected.program([&](uint32_t r){return registers.read(r);},
                 [&](uint32_t r,uint32_t v){registers.write(r,v);} ))result=0;
            }""","""   if(selected.program([&](uint32_t r){return registers.read(r);},
                 [&](uint32_t r,uint32_t v){registers.write(r,v);} ))result=0;
             char rl[200];snprintf(rl,sizeof(rl),"G buf=%08x cl10=%08x func0=%08x tp0=%08x st0=%08x func1=%08x tp1=%08x st1=%08x rev=%d",
              registers.read(0x64000+0x100*ddi),registers.read(selected.base+0x28),registers.read(0x60400),registers.read(0x60540),registers.read(0x60544),
              registers.read(0x61400),registers.read(0x61540),registers.read(0x61544),(int)vostroLaneReverse);
             vostroDPLine(rl);
            }""")
          # 9) lane reversal knob (Linux icl_combo_phy_power_up_lanes: reversed x2 -> lane 1/0 kapat)
          rep("""  const auto vk=vostroKnobs();
            uint32_t vSw""","""  const auto vk=vostroKnobs();vostroLaneReverse=vk.rev;
            uint32_t vSw""")
          import os
          hp=os.path.join(os.path.dirname(path),"kern_tgl_combo_signal.hpp")
          h=open(hp).read()
          o1="""        const uint32_t laneMask=lanes==1?0xE0U:lanes==2?0xC0U:0;"""
          assert h.count(o1)==1
          h=h.replace(o1,"""        const uint32_t laneMask=lanes==1?(vostroLaneReverse?0x70U:0xE0U):lanes==2?(vostroLaneReverse?0x30U:0xC0U):0;""")
          o2="""            const bool load=linkRate!=30 && (n==1 || n==2 || (lanes==4 && n==3));"""
          assert h.count(o2)==1
          h=h.replace(o2,"""            const unsigned ln=vostroLaneReverse?3-n:n;
                      const bool load=linkRate!=30 && (ln==1 || ln==2 || (lanes==4 && ln==3));""")
          o3="struct TGLComboSignal {"
          assert h.count(o3)==1
          h=h.replace(o3,"inline volatile bool vostroLaneReverse=false;\n"+o3)
          open(hp,"w").write(h)

          # 10) ASSR (alternate scrambler reset) kapatma + tutarli TPS3: panel TPS4'te symbol lock alamiyor
          rep("""static void vostroDPLine(const char *line) {""","""#include <pexpert/pexpert.h>
          struct VostroDPKnobs {bool loaded;bool noassr;uint32_t tps;};
          static VostroDPKnobs vostroDPKnobs() {
           static VostroDPKnobs k {false,false,0};
           if(!k.loaded){uint32_t v=0;if(PE_parse_boot_argn("vostrotps",&v,sizeof(v)) && v>=1 && v<=3)k.tps=v;
            k.noassr=checkKernelArgument("-vostronoassr");k.loaded=true;}
           return k;
          }
          static void vostroDPLine(const char *line) {""")
          rep(""" if(!ready){vostroDP('w',port,address,data,length,kIOReturnNotReady);return kIOReturnNotReady;}
           const auto r=FunctionCast(wrapDisplay13WriteAUX,callbackXE->orgDisplay13WriteAUX)(port,address,data,length);""",
          """ if(!ready){vostroDP('w',port,address,data,length,kIOReturnNotReady);return kIOReturnNotReady;}
           uint8_t vbuf[16];void *vdata=data;
           if(data && length>=1 && length<=16) {
            const auto dk=vostroDPKnobs();bool changed=false;memcpy(vbuf,data,length);
            if(dk.noassr && address<=0x10a && address+length>0x10a && (vbuf[0x10a-address]&1)){vbuf[0x10a-address]&=~1;changed=true;}
            if(dk.tps==3 && address<=0x102 && address+length>0x102 && (vbuf[0x102-address]&0xf)==7){vbuf[0x102-address]=0x23;changed=true;}
            if(changed){vdata=vbuf;vostroDPLine("VOSTRO dpcd yeniden yazildi (noassr/tps3)");}
           }
           const auto r=FunctionCast(wrapDisplay13WriteAUX,callbackXE->orgDisplay13WriteAUX)(port,address,vdata,length);""")
          rep(""" vostroDP('W',port,address,data,length,r);""",""" vostroDP('W',port,address,vdata,length,r);""")
          rep(""" if(valid)p[0x11A]&=p[0x10];
           IOLockUnlock(c.lock);
           if(!valid){vostroRecord(""",""" if(valid)p[0x11A]&=p[0x10];
           if(valid && vostroDPKnobs().noassr && p[0x118]){p[0x118]=0;vostroDPLine("VOSTRO kaynak ASSR kapatildi (p118=0)");}
           IOLockUnlock(c.lock);
           if(!valid){vostroRecord(""")
          open(path, "w").write(s)
          print("patched v8")
          PYEOF
          python3 wex_patch.py wex/WhateverXe/kern_xe.cpp
          ( cd wex && python3 tools/build.py --release --output build/RELEASE )
          K="$(find wex/build/RELEASE -type d -name WhateverXe.kext | head -1)"
          test -n "$K"
          strings "$K/Contents/MacOS/WhateverXe" | grep -q "vostronoassr"
          mkdir -p out && cp -R "$K" out/
      - uses: actions/upload-artifact@v4
        with:
          name: k-wex
          path: out/

  bt:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thegwchr/RealtekBluetoothFirmware
          path: rbf
          persist-credentials: false
      - name: Bluetooth yamasi + derle
        run: |
          cat > rbf_patch.py <<'PYEOF'
          #!/usr/bin/env python3
          """RealtekBluetoothFirmware yamasi: XYLog satirlarini IORegistry'ye de yaz + 0bda:c829 ekle."""
          import plistlib, copy, sys
          root = sys.argv[1]
          log = root + "/RealtekBluetoothFirmware/Log.h"
          s = open(log).read()
          old = '''#define XYLog(fmt, x...)\\
          do\\
          {\\
          IOLog("%s: " fmt, "RealtekFirmware", ##x);\\
          }while(0)'''
          assert s.count(old) == 1, "Log.h makrosu bulunamadi"
          new = '''#include <stdarg.h>
          #include <IOKit/IORegistryEntry.h>
          #include <libkern/OSAtomic.h>
          inline void vostroBTRecord(const char *fmt, ...) {
              static volatile SInt32 seq = 0;
              char line[240]; va_list ap; va_start(ap, fmt); vsnprintf(line, sizeof(line), fmt, ap); va_end(ap);
              for (char *c = line; *c; ++c) if (*c == '\\n') *c = ' ';
              const SInt32 n = OSIncrementAtomic(&seq);
              IORegistryEntry *r = IORegistryEntry::getRegistryRoot(); if (!r) return;
              char key[32];
              if (n < 64) { snprintf(key, sizeof(key), "VostroBT%02d", (int)n); r->setProperty(key, line); }
              r->setProperty("VostroBTLast", line);
          }
          #define XYLog(fmt, x...)\\
          do\\
          {\\
          IOLog("%s: " fmt, "RealtekFirmware", ##x);\\
          vostroBTRecord(fmt, ##x);\\
          }while(0)'''
          s = s.replace(old, new)
          open(log, "w").write(s)

          p = root + "/RealtekBluetoothFirmware/Info.plist"
          d = plistlib.load(open(p, "rb"))
          pers = d["IOKitPersonalities"]
          key = "RealtekBluetoothFirmware_0bda_c829"
          if key not in pers:
              tmpl = next(v for k, v in pers.items() if k.startswith("RealtekBluetoothFirmware_0bda_"))
              n = copy.deepcopy(tmpl); n["idVendor"] = 0x0bda; n["idProduct"] = 0xc829; pers[key] = n
          plistlib.dump(d, open(p, "wb"))

          # Sicak yeniden baslatma: firmware zaten yukluyse (lmp_subver tabloda yok) Linux btrtl gibi devam et
          bt = root + "/RealtekBluetoothFirmware/BtRtl.cpp"
          b = open(bt).read()
          old_b = """    m_icInfo = matchIc(ver.lmp_subver, ver.hci_rev, ver.hci_ver);
              if (!m_icInfo) {
                  XYLog("unsupported controller (lmp_subver %04x hci_rev %04x hci_ver %02x)\\n",
                        ver.lmp_subver, ver.hci_rev, ver.hci_ver);
                  return false;
              }"""
          new_b = """    m_icInfo = matchIc(ver.lmp_subver, ver.hci_rev, ver.hci_ver);
              if (!m_icInfo) {
                  XYLog("unsupported controller (lmp_subver %04x hci_rev %04x hci_ver %02x)\\n",
                        ver.lmp_subver, ver.hci_rev, ver.hci_ver);
                  XYLog("VOSTRO: assuming firmware already loaded, continuing\\n");
                  strlcpy(m_fwName, "preloaded", sizeof(m_fwName));
                  return true;
              }"""
          assert b.count(old_b) == 1, "BtRtl unsupported blogu bulunamadi"
          b = b.replace(old_b, new_b)
          open(bt, "w").write(b)
          print("rbf patched v2")
          PYEOF
          python3 rbf_patch.py rbf
          cd rbf && make
          codesign -f -s - build/RealtekBluetoothFirmware.kext
          mkdir -p ../out && cp -R build/RealtekBluetoothFirmware.kext ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: k-bt
          path: out/

