          python3 - <<'PYEOF'
          # CS8409: AppleHDA yamalari (AppleALC'deki her Realtek-disi codec bunlari kullanir; yoksa motor olusmaz)
          # + layout 11 = hoparlor + dahili mikrofon
          import plistlib, copy, re
          R='Resources/CS8409/'
          info=plistlib.load(open(R+'Info.plist','rb'))
          def P(f,r,c,mn=None,mx=None):
              d={'Name':'AppleHDA','Find':bytes.fromhex(f),'Replace':bytes.fromhex(r),'Count':c}
              if mn: d['MinKernel']=mn
              if mx: d['MaxKernel']=mx
              return d
          info['Patches']=[
              P('c60600488bbf6801','c60601488bbf6801',1,18),
              P('41c60600498bbc24','41c60601498bbc24',1,13,13),
              P('41c60600488bbb68','41c60601488bbb68',1,14),
              P('41c6864301000000','41c6864301000001',1,13),
              P('8419d411','09841310',2,13),
              P('8319d411','00000000',2,15,15),
              P('8a19d411','00000000',2,16),
          ]
          info['Files']['Layouts'].append({'Comment':'Vostro 3520 CS8409 hoparlor + dahili mikrofon','Id':11,'Path':'layout11.xml.zlib'})
          info['Files']['Platforms'].append({'Comment':'Vostro 3520 CS8409 hoparlor + dahili mikrofon','Id':11,'Path':'Platforms11.xml.zlib'})
          plistlib.dump(info,open(R+'Info.plist','wb'))
          def rd(f): return plistlib.loads(b'<?xml version="1.0"?><plist version="1.0">'+open(R+f,'rb').read()+b'</plist>')
          def wr(f,d):
              x=plistlib.dumps(d).decode()
              x=x[x.index('<dict>'):x.rindex('</plist>')]
              open(R+f,'w').write(x)
          l8=rd('layout8.xml'); l9=rd('layout9.xml')
          l11=copy.deepcopy(l8); l11['LayoutID']=11
          r=l11['PathMapRef'][0]; r['Inputs']=['Mic']; r['Mic']={}; r['PathMapID']=11
          wr('layout11.xml',l11)
          p8=rd('Platforms8.xml'); p9=rd('Platforms9.xml')
          p11=copy.deepcopy(p8)
          p11['PathMaps'][0]['PathMapID']=11
          p11['PathMaps'][0]['PathMap']=p9['PathMaps'][0]['PathMap']+p8['PathMaps'][0]['PathMap']
          wr('Platforms11.xml',p11)
          es=plistlib.load(open('/tmp/pin_entries.plist','rb'))
          e8=[e for e in es if e['LayoutID']==8][0]
          e11=copy.deepcopy(e8); e11['LayoutID']=11; es.append(e11)
          plistlib.dump(es,open('/tmp/pin_entries.plist','wb'))
          print('CS8409 yamalar:',len(info['Patches']),'layoutlar:',[x['Id'] for x in info['Files']['Layouts']])
          PYEOF
          python3 - <<'PYEOF'
          import plistlib
          p='Resources/PinConfigs.kext/Contents/Info.plist'
          d=plistlib.load(open(p,'rb'))
          es=plistlib.load(open('/tmp/pin_entries.plist','rb'))
          lst=d['IOKitPersonalities']['as.vit9696.AppleALC']['HDAConfigDefault']
          ids={(e['CodecID'],e['LayoutID']) for e in es}
          lst[:]=[x for x in lst if (x.get('CodecID'),x.get('LayoutID')) not in ids]
          lst.extend(es)
          plistlib.dump(d,open(p,'wb'))
          print('pinconfig eklendi', len(es))
          PYEOF
      - name: CS8409 format yamasi (AppleALC executeVerb)
        working-directory: alc
        run: |
          python3 - <<'PYEOF'
          p='AppleALC/kern_alc.cpp'
          s=open(p).read()
          old="""	return FunctionCast(IOHDACodecDevice_executeVerb, callbackAlc->orgIOHDACodecDevice_executeVerb)(hdaCodecDevice, nid, verb, param, output, waitForSuccess);
          }"""
          new="""	auto vOrg = FunctionCast(IOHDACodecDevice_executeVerb, callbackAlc->orgIOHDACodecDevice_executeVerb);
          	IOReturn vRes = vOrg(hdaCodecDevice, nid, verb, param, output, waitForSuccess);
          	// Vostro 3520 CS8409: ses cikis birimleri (0x02-0x11) PCM/format parametresini 0 dondurur.
          	// HDA spesifikasyonuna gore bu durumda AFG (0x01) degerleri gecerlidir; AppleHDA'ya onlari ver.
          	if (vRes == kIOReturnSuccess && output && verb == 0xF00 && (param == 0x0A || param == 0x0B) &&
          	    nid >= 0x02 && nid <= 0x11 && *output == 0) {
          		static void *vDev = nullptr; static bool vIsCS = false; static uint32_t vCount = 0;
          		if (vDev != hdaCodecDevice) {
          			unsigned int vid = 0;
          			vOrg(hdaCodecDevice, 0, 0xF00, 0x00, &vid, true);
          			vIsCS = (vid == 0x10138409); vDev = hdaCodecDevice;
          		}
          		if (vIsCS) {
          			unsigned int afg = 0;
          			if (vOrg(hdaCodecDevice, 1, 0xF00, param, &afg, true) == kIOReturnSuccess && afg) {
          				*output = afg;
          				vCount++;
          				auto root = IORegistryEntry::getRegistryRoot();
          				if (root) root->setProperty("VostroCS8409FormatFix", vCount, 32);
          			}
          		}
          	}
          	return vRes;
          }"""
          assert s.count(old)==1, "anchor yok"
          s=s.replace(old,new)
          open(p,'w').write(s)
          print("CS8409 format yamasi uygulandi")
          PYEOF
      - name: Derle
        working-directory: alc
        run: |
          xcodebuild -jobs 2 -configuration Release -arch x86_64 2>&1 | tail -40
          K="$(find build -type d -name AppleALC.kext -path '*Release*' | head -1)"
          test -n "$K"
          R="$(find . -name kern_resources.cpp | head -1)"; echo "kaynak: $R"
          grep -n 'CS8409\|0x8409' "$R" | head -5
          grep -q 'CS8409' "$R"
          mkdir -p ../out && cp -R "$K" ../out/
      - name: VoodooHDA (CS8409 icin, AppleHDA'siz bagimsiz surucu)
        continue-on-error: true
        run: |
          set -e
          git clone -q --depth 1 -b 4.0.1 https://github.com/CloverHackyColor/VoodooHDA vhda
          git clone -q --depth 1 https://github.com/joevt/MacKernelSDK.git MacKernelSDK
          PC=alc/Resources/PinConfigs.kext/Contents/Info.plist
          grep -c 269714441 "$PC"
          python3 vhda/tools/gen_pinconfigs.py "$PC" vhda/tranc
          grep -n 0x10138409 vhda/tranc/AppleALCPinConfigs.cpp
          python3 - <<'PYEOF'
          import plistlib
          p='vhda/tranc/Info.plist'
          d=plistlib.load(open(p,'rb'))
          v=d['IOKitPersonalities']['VoodooHDA']
          v['IONameMatch']=['HDEF','HDAS']
          v['IOProbeScore']=100000
          v.pop('LayoutId',None)
          plistlib.dump(d,open(p,'wb'))
          print('VoodooHDA Info.plist: HDEF eslesme + yuksek skor')
          PYEOF
          cd vhda/tranc
          xcodebuild -project VoodooHDA_BS.xcodeproj -configuration Release -arch x86_64 CODE_SIGN_IDENTITY=- 2>&1 | tail -30
          K="$(find build -type d -name VoodooHDA.kext -path '*Release*' | head -1)"
          test -n "$K"
          cp -R "$K" "$GITHUB_WORKSPACE/out/"
          ls "$GITHUB_WORKSPACE/out"
