             char rl[240];snprintf(rl,sizeof(rl),"G buf=""")

          # 14) BIOS/GOP dahili ekrani DPLL1 ile suruyor (clka=..05), macOS DPLL0 seciyor. -vostrodpll1: GOP gibi DPLL1 kullan
          rep("""uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {""","""static void vostroUseDPLL1(Display13FBSSTIO &io,uint32_t ddi) {
           if(ddi!=0)return;
           const uint32_t clka=io.read(0x164280);
           if((clka&3)==1){vostroDPLine("DPLL1 zaten secili");return;}
           const uint32_t src=clka&3;if(src>1)return;
           const uint32_t sc0=io.read(src?0x16428C:0x164284),sc1=io.read(src?0x164290:0x164288);
           const bool bOn=!(clka&(1U<<11)) && ((clka>>2)&3)==1;
           if(bOn){vostroDPLine("DPLL1 DDI B tarafindan kullaniliyor, atlandi");return;}
           io.write(0x164280,clka|(1U<<10));                                  // DDI A saatini kapat
           uint32_t en=io.read(0x46014);
           if(en&0x80000000U){io.write(0x46014,en&~0x80000000U);for(int i=0;i<200 && (io.read(0x46014)&0x40000000U);i++)IODelay(10);}
           en=io.read(0x46014);
           if(!(en&0x08000000U)){io.write(0x46014,en|0x08000000U);for(int i=0;i<200 && !(io.read(0x46014)&0x04000000U);i++)IODelay(10);}
           io.write(0x16428C,sc0);io.write(0x164290,sc1);(void)io.read(0x164290);
           io.write(0x46014,io.read(0x46014)|0x80000000U);for(int i=0;i<200 && !(io.read(0x46014)&0x40000000U);i++)IODelay(10);
           io.write(0x164280,(io.read(0x164280)&~3U)|1U|(1U<<10));            // DDI A -> DPLL1 (hala kapali)
           io.write(0x164280,io.read(0x164280)&~(1U<<10));                    // DDI A saatini ac
           char l[200];snprintf(l,sizeof(l),"DPLL1 secildi: en1=%08x c1=%08x/%08x clka=%08x (onceki clka=%08x)",
            io.read(0x46014),io.read(0x16428C),io.read(0x164290),io.read(0x164280),clka);
           vostroDPLine(l);
          }
          uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {""")
          rep("""     vostroFixPLL(registers,binding.ddi,Display13FBMemory::field<uint32_t>(p,0x128),vostroKnobs().pll);""",
          """     vostroFixPLL(registers,binding.ddi,Display13FBMemory::field<uint32_t>(p,0x128),vostroKnobs().pll);
               if(vostroKnobs().dpll1)vostroUseDPLL1(registers,binding.ddi);""")
          open(path, "w").write(s)
          print("patched v14")
          PYEOF
          python3 wex_patch.py wex/WhateverXe/kern_xe.cpp
