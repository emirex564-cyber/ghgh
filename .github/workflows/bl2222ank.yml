          		ADoEdAgABHUAAwR0gAAEdQAEBHQo/wR1AAUEdABiBHUABgR0gB8EdQAHBHQo
          		PwR1AAgEdIBcBHUACQR0ACMEdQAKBHQAAAR1AAEEdABiBHUAAAR0kAgEdQBo
          		BHQAAAR1AIIEdPwDBHUAwAR0mZkEdQDFBHQAAAR1AMAEdAAAABcWPwAXFyIA
          		FxUC
          		</data>
          		<key>WakeVerbReinit</key>
          		<true/>
          	</dict>
          </array>
          </plist>
          XEOF
          python3 - <<'PYEOF'
          # CS8409: AppleHDA yamalari (AppleALC'deki her Realtek-disi codec bunlari kullanir; yoksa motor olusmaz)
          # + layout 11 = hoparlor + dahili mikrofon
          import plistlib, copy, re
          R='Resources/CS8409/'
          info=plistlib.load(open(R+'Info.plist','rb'))
          def P(f,r,c,mn=None,mx=None):
              d={'Name':'AppleHDA','Find':bytes.fromhex(f),'Replace':bytes.fromhex(r),'Count':c}
              if mn: d['MinKernel']=mn
              if mx: d['MaxKernel']=mx
              return d
          info['Patches']=[
              P('c60600488bbf6801','c60601488bbf6801',1,18),
              P('41c60600498bbc24','41c60601498bbc24',1,13,13),
              P('41c60600488bbb68','41c60601488bbb68',1,14),
              P('41c6864301000000','41c6864301000001',1,13),
              P('8419d411','09841310',2,13),
              P('8319d411','00000000',2,15,15),
              P('8a19d411','00000000',2,16),
          ]
          info['Files']['Layouts'].append({'Comment':'Vostro 3520 CS8409 hoparlor + dahili mikrofon','Id':11,'Path':'layout11.xml.zlib'})
          info['Files']['Platforms'].append({'Comment':'Vostro 3520 CS8409 hoparlor + dahili mikrofon','Id':11,'Path':'Platforms11.xml.zlib'})
          plistlib.dump(info,open(R+'Info.plist','wb'))
          def rd(f): return plistlib.loads(b'<?xml version="1.0"?><plist version="1.0">'+open(R+f,'rb').read()+b'</plist>')
          def wr(f,d):
              x=plistlib.dumps(d).decode()
              x=x[x.index('<dict>'):x.rindex('</plist>')]
              open(R+f,'w').write(x)
          l8=rd('layout8.xml'); l9=rd('layout9.xml')
          l11=copy.deepcopy(l8); l11['LayoutID']=11
          r=l11['PathMapRef'][0]; r['Inputs']=['Mic']; r['Mic']={}; r['PathMapID']=11
          wr('layout11.xml',l11)
          p8=rd('Platforms8.xml'); p9=rd('Platforms9.xml')
          p11=copy.deepcopy(p8)
          p11['PathMaps'][0]['PathMapID']=11
          p11['PathMaps'][0]['PathMap']=p9['PathMaps'][0]['PathMap']+p8['PathMaps'][0]['PathMap']
          wr('Platforms11.xml',p11)
          es=plistlib.load(open('/tmp/pin_entries.plist','rb'))
          e8=[e for e in es if e['LayoutID']==8][0]
          e11=copy.deepcopy(e8); e11['LayoutID']=11; es.append(e11)
          plistlib.dump(es,open('/tmp/pin_entries.plist','wb'))
          print('CS8409 yamalar:',len(info['Patches']),'layoutlar:',[x['Id'] for x in info['Files']['Layouts']])
          PYEOF
          python3 - <<'PYEOF'
          import plistlib
          p='Resources/PinConfigs.kext/Contents/Info.plist'
          d=plistlib.load(open(p,'rb'))
          es=plistlib.load(open('/tmp/pin_entries.plist','rb'))
          lst=d['IOKitPersonalities']['as.vit9696.AppleALC']['HDAConfigDefault']
          ids={(e['CodecID'],e['LayoutID']) for e in es}
          lst[:]=[x for x in lst if (x.get('CodecID'),x.get('LayoutID')) not in ids]
          lst.extend(es)
          plistlib.dump(d,open(p,'wb'))
          print('pinconfig eklendi', len(es))
          PYEOF
      - name: VoodooHDA (CS8409 icin, AppleHDA'siz bagimsiz surucu)
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          git clone -q --depth 1 -b 4.0.1 https://github.com/CloverHackyColor/VoodooHDA vhda
          git clone -q --depth 1 https://github.com/joevt/MacKernelSDK.git MacKernelSDK
          PC=alc/Resources/PinConfigs.kext/Contents/Info.plist
          grep -c 269714441 "$PC"
          python3 vhda/tools/gen_pinconfigs.py "$PC" vhda/tranc
          grep -n 0x10138409 vhda/tranc/AppleALCPinConfigs.cpp
          python3 - <<'PYEOF'
          import plistlib
          p='vhda/tranc/Info.plist'
          d=plistlib.load(open(p,'rb'))
          v=d['IOKitPersonalities']['VoodooHDA']
          v.pop('IONameMatch',None)
          v['IOPCIMatch']='0x51c88086'
          v['IOPCIClassMatch']='0x04030000&0xffff0000'
          v['IOProbeScore']=100000
          v.pop('LayoutId',None)
          v['AllowMSI']=False
          v['InhibitCache']=True
          v['VoodooHDAVerboseLevel']=1
          # CS8409: kulaklik pini 0x24'u kapat -> hoparlor (0x2c<-0x0a) tek basina 2 kanalli aygit olsun
          v['NodesToPatch']=[{'Codec':0,'Node':0x24,'Config':0x411111f0}]
          plistlib.dump(d,open(p,'wb'))
          print('VoodooHDA Info.plist: HDEF eslesme + yuksek skor')
          PYEOF
          # CS8409 70 dugume sahip (0x02-0x47); VoodooHDA 50'den fazlasini reddediyor -> sinir 250
          python3 - <<'PYEOF'
          p='vhda/tranc/Parser.cpp'; s=open(p).read()
          a='if (numNodes < 0 || numNodes > 50) {'; b='if (funcGroup->numNodes > 0 && funcGroup->numNodes < 50)'
          assert s.count(a)==1 and s.count(b)==1
          s=s.replace(a,'if (numNodes < 0 || numNodes > 250) {').replace(b,'if (funcGroup->numNodes > 0 && funcGroup->numNodes < 250)')
          # Acilista ses ancak uyku/uyanmadan sonra geliyor: init sonunda uyanma sirasini (D0 + CS8409 verb + commit) tekrarla
          a2='\taudioCommit(funcGroup);\n//\tdumpMsg("HP switch init...\\n");'
          assert s.count(a2)==1, 'commit anchor yok'
          s=s.replace(a2,'\taudioCommit(funcGroup);\n\tIOSleep(100);\n\tpowerup(funcGroup);\n\tapplyAppleALCWakeVerbs(funcGroup);\n\taudioCommit(funcGroup);\n\tlogMsg("Vostro CS8409: wake sirasi acilista tekrarlandi\\n");\n//\tdumpMsg("HP switch init...\\n");')
          open(p,'w').write(s); print('dugum siniri 250 + acilis wake sirasi')
          PYEOF
          echo '' | base64 -d > /tmp/vostro_clock.py
          echo '' | base64 -d > /tmp/vostro_timerwake.py
          # Varyantlar: A=sadece acilis wake sirasi, B=A+zamanlayicili ses saati, C=A+5sn yazilim uyu/uyan
          echo '' | base64 -d > /tmp/vostro_diag.py
          python3 /tmp/vostro_diag.py vhda/tranc
          echo '' | base64 -d > /tmp/vostro_buf.py
          # D = C (uyu/uyan + kanal yeniden baslatma) + B (zamanlayicili saat), buyuk tampon
          echo '' | base64 -d > /tmp/vostro_olay.py
          echo '' | base64 -d > /tmp/vostro_derin.py
          echo '' | base64 -d > /tmp/vostro_clock2.py
          echo '' | base64 -d > /tmp/vostro_kick.py
          echo '' | base64 -d > /tmp/vostro_guard.py
          # C = uyu/uyan, D = C + 2ms saat yoklayici (eski)
          # E = kara kutu + saat v2 (sadece gercek kesme + bekci) + amfi GPIO1 uyandirma (uyu/uyan YOK)
          # F = E + 4 sn sonra uyu/uyan (yedek)
          echo '' | base64 -d > /tmp/vostro_offset.py
          # H = C (uyu/uyan) + saat v2 + kara kutu + uyku korumasi, AMFI TETIKLEME YOK (onerilen)
          cp -R vhda vhdaC; cp -R vhda vhdaE; cp -R vhda vhdaF; cp -R vhda vhdaH
          python3 /tmp/vostro_timerwake.py vhdaC/tranc
          for V in E F; do
            python3 /tmp/vostro_olay.py vhda$V/tranc
            python3 /tmp/vostro_clock2.py vhda$V/tranc
            python3 /tmp/vostro_kick.py vhda$V/tranc
            python3 /tmp/vostro_derin.py vhda$V/tranc
          done
          python3 /tmp/vostro_timerwake.py vhdaF/tranc
          python3 /tmp/vostro_timerwake.py vhdaH/tranc
          python3 /tmp/vostro_olay.py vhdaH/tranc
          python3 /tmp/vostro_clock2.py vhdaH/tranc
          python3 /tmp/vostro_derin.py vhdaH/tranc
          python3 /tmp/vostro_guard.py vhdaH/tranc
          # I = H + guvenlik payi 1024 kare (IsoTooOld kesilmeleri)
          cp -R vhdaH vhdaI
          python3 /tmp/vostro_offset.py vhdaI/tranc
          echo '' | base64 -d > /tmp/vostro_clock3.py
          # J = I + LPIB duzeltmeli damga (kesme gecikmesi telafisi) -> ONERILEN
          cp -R vhdaI vhdaJ
          python3 /tmp/vostro_clock3.py vhdaJ/tranc
          echo '' | base64 -d > /tmp/vostro_pll.py
          # K = J + PLL puruzsuz saat -> ONERILEN
          cp -R vhdaJ vhdaK
          python3 /tmp/vostro_pll.py vhdaK/tranc
          for V in K J I C; do
            ( cd vhda$V/tranc && xcodebuild -project VoodooHDA_BS.xcodeproj -configuration Release -arch x86_64 CODE_SIGN_IDENTITY=- 2>&1 | tail -8 )
            K="$(find vhda$V/tranc/build -type d -name VoodooHDA.kext -path '*Release*' | head -1)"
            if [ -n "$K" ]; then cp -R "$K" "$GITHUB_WORKSPACE/out/VoodooHDA-$V.kext"; else echo "UYARI: $V derlenemedi"; fi
          done
          ls -d "$GITHUB_WORKSPACE"/out/VoodooHDA-*.kext
          for V in K J I C; do [ -d "$GITHUB_WORKSPACE/out/VoodooHDA-$V.kext" ] && { cp -R "$GITHUB_WORKSPACE/out/VoodooHDA-$V.kext" "$GITHUB_WORKSPACE/out/VoodooHDA.kext"; break; }; done
          test -d "$GITHUB_WORKSPACE/out/VoodooHDA.kext"
          clang -arch x86_64 vhda/tranc/getdump.c -I vhda/tranc -o "$GITHUB_WORKSPACE/out/vhda-getdump" -framework IOKit -framework CoreFoundation -Wno-deprecated-declarations || echo "getdump derlenemedi"
          ls "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: voodoohda
          path: out/
