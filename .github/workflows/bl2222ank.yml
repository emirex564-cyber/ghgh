# Vostro 3520 - TEK TIK PAKET
# WhateverXe (ekran yamasi) + RealtekBluetoothFirmware (BT yamasi) derlenir,
# kurulum scriptleriyle birlikte vostro-paket.zip olarak verilir.
# Kullanim: repo > .github/workflows/build-vostro-paket.yml > Actions > Build Vostro Paket > Run workflow
name: Build Vostro Paket

on:
  workflow_dispatch:

jobs:
  wex:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: b00t0x/WhateverXe
          ref: "0.8.3"
          path: wex
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: wex/MacKernelSDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: "1.7.2"
          path: lilu
          persist-credentials: false
      - name: Lilu gelistirme dosyalari
        run: |
          mkdir -p wex/Lilu.kext/Contents/Resources
          ln -s "$GITHUB_WORKSPACE/lilu/Lilu/Headers" wex/Lilu.kext/Contents/Resources/Headers
          ln -s "$GITHUB_WORKSPACE/lilu/Lilu/Library" wex/Lilu.kext/Contents/Resources/Library
      - name: Ekran yamasi + derle
        run: |
          cat > wex_patch.py <<'PYEOF'
          #!/usr/bin/env python3
          """Vostro 3520 WhateverXe 0.8.3 yamasi v4: kayit + boot-arg ile sinyal ayari.
            boot-args: vostroswing=0..3  vostroemph=0..3  -vostrolow   (hicbiri yoksa davranis orijinalle ayni)
            python3 wex_patch.py <WhateverXe/kern_xe.cpp>
          Kayitlar IORegistry kokunde: VostroCombo00..47, VostroComboLast, VostroComboCount
          """
          import sys
          path = sys.argv[1]
          s = open(path).read()

          def rep(old, new):
              global s
              assert s.count(old) == 1, "bulunamadi: " + old[:70]
              s = s.replace(old, new)

          helper = """
          static volatile SInt32 vostroSeq=0;
          static void vostroRecord(const char *fmt,...) {
           char line[256];__builtin_va_list ap;__builtin_va_start(ap,fmt);vsnprintf(line,sizeof(line),fmt,ap);__builtin_va_end(ap);
           IOLog("VOSTRO %s\\n",line);
           const SInt32 n=OSIncrementAtomic(&vostroSeq);
           auto root=IORegistryEntry::getRegistryRoot();if(!root)return;
           char key[32];
           if(n<96){snprintf(key,sizeof(key),"VostroCombo%02d",(int)n);root->setProperty(key,line);}
           root->setProperty("VostroComboLast",line);
           root->setProperty("VostroComboCount",(unsigned long long)(n+1),32);
          }
          static volatile uint32_t vostroLastWhy=0xFFFFFFFFU,vostroLastDDI=0xFFFFFFFFU;
          #include <pexpert/pexpert.h>
          struct VostroKnobs {uint32_t swing,emph;bool low;bool loaded;uint32_t tps;bool rev;bool pll;};
          static VostroKnobs vostroKnobs() {
           static VostroKnobs k {0,0,false,false,0,false,false};
           if(!k.loaded) {
            uint32_t v=0;
            if(PE_parse_boot_argn("vostroswing",&v,sizeof(v)) && v<=3)k.swing=v;
            v=0;if(PE_parse_boot_argn("vostroemph",&v,sizeof(v)) && v<=3)k.emph=v;
            v=0;if(PE_parse_boot_argn("vostrotps",&v,sizeof(v)) && v>=1 && v<=3)k.tps=v;
            k.low=checkKernelArgument("-vostrolow");k.rev=checkKernelArgument("-vostrorev");k.pll=checkKernelArgument("-vostropll");k.loaded=true;
            vostroRecord("knobs swing>=%u emph>=%u low=%d tps=%u rev=%d",k.swing,k.emph,(int)k.low,k.tps,(int)k.rev);
           }
           return k;
          }
          """

          # 1) helper'i ilk kullanimdan once koy
          rep("uint32_t XE::wrapDisplay13PortTraining(void *port,void *request) {",
              helper + "uint32_t XE::wrapDisplay13PortTraining(void *port,void *request) {")

          # 2) training wrapper: neden reddedildigini ve sonucu kaydet
          rep(""" IOLockLock(c.lock);auto p=display13SSTPort(port);
           const bool valid=p && p[0x115]==1 && !p[0x117] && p[0x10]<=1 && p[0x11A]<=1;
           if(valid)p[0x11A]&=p[0x10];
           IOLockUnlock(c.lock);if(!valid)return kIOReturnNotReady;
           return FunctionCast(wrapDisplay13PortTraining,s->orgDisplay13PortTraining)(port,request);""",
          """ IOLockLock(c.lock);auto p=display13SSTPort(port);
           const bool valid=p && p[0x115]==1 && !p[0x117] && p[0x10]<=1 && p[0x11A]<=1;
           const unsigned vDDI=p?Display13FBMemory::field<uint32_t>(p,0x120):0xFFU;
           const unsigned v115=p?p[0x115]:0xFFU,v117=p?p[0x117]:0xFFU,v10=p?p[0x10]:0xFFU,v11A=p?p[0x11A]:0xFFU;
           if(valid)p[0x11A]&=p[0x10];
           IOLockUnlock(c.lock);
           if(!valid){vostroRecord("train REFUSED sst=%d ddi=%u f115=%u f117=%u f10=%u f11a=%u",(int)(p!=nullptr),vDDI,v115,v117,v10,v11A);return kIOReturnNotReady;}
           const uint32_t vRes=FunctionCast(wrapDisplay13PortTraining,s->orgDisplay13PortTraining)(port,request);
           vostroRecord("train ddi=%u result=%x",vDDI,vRes);
           return vRes;""")

          # 3) display13SSTPort: hangi kontrolun tutmadigini bit olarak kaydet (davranis ayni)
          rep("""uint8_t *XE::display13SSTPort(void *port) {
           auto s=callbackXE;auto &c=display13FBPower;auto object=static_cast<OSObject *>(port);
           if(!s->display13FramebufferRequested || s->xeProfile.display!=XELP::Display::XeLPD || !s->display13FBSSTHooksReady ||
              !object || object->getMetaClass()->getClassSize()<0x624 || !c.controller ||
              c.controller!=s->adlnTopologyController || !adlnWriterMappingBound() ||
              c.clockFaulted || c.memoryFaulted || c.panelFaulted || c.clockStopped || !s->adlnOutputWiring.described())return nullptr;
           auto p=static_cast<uint8_t *>(port);auto config=Display13FBMemory::field<uint32_t *>(p,0x548);
           if(!Display13FBTopology::selected(s->adlnPlatform,config,s->adlnOutputWiring) ||
              !(s->adlnOutputWiring.links()&(1U<<config[0])) || p[0x117] ||
              Display13FBMemory::field<uint32_t>(p,0x120)!=config[0] ||""",
          """uint8_t *XE::display13SSTPort(void *port) {
           auto s=callbackXE;auto &c=display13FBPower;auto object=static_cast<OSObject *>(port);
           {
            uint32_t why=0;
            if(!s->display13FramebufferRequested)why|=0x1;
            if(s->xeProfile.display!=XELP::Display::XeLPD)why|=0x2;
            if(!s->display13FBSSTHooksReady)why|=0x4;
            if(!object || object->getMetaClass()->getClassSize()<0x624)why|=0x8;
            if(!c.controller || c.controller!=s->adlnTopologyController)why|=0x10;
            if(!adlnWriterMappingBound())why|=0x20;
            if(c.clockFaulted)why|=0x40;
            if(c.memoryFaulted)why|=0x80;
            if(c.panelFaulted)why|=0x100;
            if(c.clockStopped)why|=0x200;
            if(!s->adlnOutputWiring.described())why|=0x400;
            uint32_t ddi=0xFFU,mode=0xFFFFU;
            if(!(why&0x8)) {
             auto pp=static_cast<uint8_t *>(port);auto cfg=Display13FBMemory::field<uint32_t *>(pp,0x548);
             if(!Display13FBTopology::selected(s->adlnPlatform,cfg,s->adlnOutputWiring))why|=0x800;
             else {
              ddi=cfg[0];mode=Display13FBMemory::field<uint32_t>(pp,0x550);
              if(!(s->adlnOutputWiring.links()&(1U<<ddi)))why|=0x1000;
              if(pp[0x117])why|=0x2000;
              if(Display13FBMemory::field<uint32_t>(pp,0x120)!=ddi)why|=0x4000;
              if(ddi>=3 ? mode!=((s->adlnOutputWiring.typeC&(1U<<ddi))?3U:4U) : mode>1U)why|=0x8000;
              if(Display13FBMemory::field<void *>(pp,0x578)!=c.access)why|=0x10000;
             }
            }
            if(why!=vostroLastWhy || ddi!=vostroLastDDI) {
             vostroLastWhy=why;vostroLastDDI=ddi;
             vostroRecord("sst ddi=%u why=%x mode=%u links=%x panel=%x dp=%x described=%d",ddi,why,mode,
              (unsigned)s->adlnOutputWiring.links(),(unsigned)s->adlnOutputWiring.panel,(unsigned)s->adlnOutputWiring.dp,(int)s->adlnOutputWiring.described());
            }
           }
           if(!s->display13FramebufferRequested || s->xeProfile.display!=XELP::Display::XeLPD || !s->display13FBSSTHooksReady ||
              !object || object->getMetaClass()->getClassSize()<0x624 || !c.controller ||
              c.controller!=s->adlnTopologyController || !adlnWriterMappingBound() ||
              c.clockFaulted || c.memoryFaulted || c.panelFaulted || c.clockStopped || !s->adlnOutputWiring.described())return nullptr;
           auto p=static_cast<uint8_t *>(port);auto config=Display13FBMemory::field<uint32_t *>(p,0x548);
           if(!Display13FBTopology::selected(s->adlnPlatform,config,s->adlnOutputWiring) ||
              !(s->adlnOutputWiring.links()&(1U<<config[0])) || p[0x117] ||
              Display13FBMemory::field<uint32_t>(p,0x120)!=config[0] ||""")

          # 4) hook kurulumu: kaydin calistigini acilista dogrula
          rep(""" display13FBSSTHooksReady=patcher.routeMultiple(index,routes,arrsize(routes),address,size);patcher.clearError();
           return display13FBSSTHooksReady;""",
          """ display13FBSSTHooksReady=patcher.routeMultiple(index,routes,arrsize(routes),address,size);patcher.clearError();
           vostroRecord("boot sst-hooks=%d",(int)display13FBSSTHooksReady);
           return display13FBSSTHooksReady;""")

          # 5a) sinyal: boot-arg ile minimum swing/emph ve low-swing
          rep("""  if(selected.selectADLP(ddi,Display13FBMemory::field<uint32_t>(p,0x124),Display13FBMemory::field<uint32_t>(p,0x128),swing,emphasis,(s->adlnOutputWiring.panel&(1U<<ddi))!=0,s->firmwarePorts.panel.lowSwing) &&""",
          """  const auto vk=vostroKnobs();
            uint32_t vSw=swing>vk.swing?swing:vk.swing,vEm=emphasis>vk.emph?emphasis:vk.emph;
            if(vSw+vEm>3)vEm=3-vSw;
            if(selected.selectADLP(ddi,Display13FBMemory::field<uint32_t>(p,0x124),Display13FBMemory::field<uint32_t>(p,0x128),vSw,vEm,(s->adlnOutputWiring.panel&(1U<<ddi))!=0,vk.low || s->firmwarePorts.panel.lowSwing) &&""")
          # 5) sinyal fonksiyonu (onceki tani)
          rep(""" if(!s->adlnOutputWiring.links() || display13HDMIPort(port))
            return FunctionCast(wrapDisplay13SignalLevels,s->orgDisplay13SignalLevels)(port,swing,emphasis,overrideConfig);""",
          """ if(!s->adlnOutputWiring.links() || display13HDMIPort(port)) {
            vostroRecord("signal donor-path links=%x swing=%u emph=%u",(unsigned)s->adlnOutputWiring.links(),swing,emphasis);
            return FunctionCast(wrapDisplay13SignalLevels,s->orgDisplay13SignalLevels)(port,swing,emphasis,overrideConfig);
           }""")
          rep("""       [&](uint32_t r,uint32_t v){registers.write(r,v);} ))result=0;
            }
           }
           IOLockUnlock(c.lock);return result;""",
          """       [&](uint32_t r,uint32_t v){registers.write(r,v);} ))result=0;
            }
            vostroRecord("signal ddi=%u lanes=%u rate=%u swing=%u emph=%u used=%u/%u low=%d lvl=%u result=%x",ddi,
             Display13FBMemory::field<uint32_t>(p,0x124),Display13FBMemory::field<uint32_t>(p,0x128),swing,emphasis,vSw,vEm,(int)selected.low,selected.level,result);
           }
           IOLockUnlock(c.lock);return result;""")

          # 6) training pattern (TPS1/2/3/4) kaydi
          rep("""uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {
           auto s=callbackXE;auto &c=display13FBPower;""",
          """uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {
           auto s=callbackXE;auto &c=display13FBPower;
           vostroRecord("pattern %u",pattern);
           if(pattern==4 && vostroKnobs().tps) {pattern=vostroKnobs().tps;vostroRecord("pattern 4 -> %u (vostrotps)",pattern);}""")
          rep(""" if(result || pattern>5)return result;
           return program(false)?0:kIOReturnNotReady;""",""" if(result || pattern>5) {vostroRecord("pattern %u donor-result=%x",pattern,result);return result;}
           const bool vOk=program(false);if(!vOk)vostroRecord("pattern %u framing-fail",pattern);
           return vOk?0:kIOReturnNotReady;""")

          # 7) DPCD/AUX trafigi: panelin ne dedigini gormek icin (lane status 0x202..)
          rep("""uint32_t XE::wrapDisplay13ReadAUX(void *port,uint32_t address,void *data,uint32_t length) {""",
          """static volatile SInt32 vostroDPSeq=0;
          static void vostroDP(char rw,void *port,uint32_t address,const void *data,uint32_t length,uint32_t r) {
           const SInt32 n=OSIncrementAtomic(&vostroDPSeq);if(n>=480)return;
           uint32_t ddi=99;
           if(port){auto cfg=*reinterpret_cast<uint32_t **>(static_cast<uint8_t *>(port)+0x548);if(cfg)ddi=cfg[0];}
           char line[160];int o=snprintf(line,sizeof(line),"%c d%u %04x n%u r%x:",rw,ddi,address,length,r);
           const uint32_t m=length<16?length:16;
           if(data && (rw=='W' || !r))for(uint32_t i=0;i<m && o<(int)sizeof(line)-4;i++)o+=snprintf(line+o,sizeof(line)-o," %02x",static_cast<const uint8_t *>(data)[i]);
           auto root=IORegistryEntry::getRegistryRoot();if(!root)return;
           char key[24];snprintf(key,sizeof(key),"VostroDP%03d",(int)n);root->setProperty(key,line);
          }
          static void vostroDPLine(const char *line) {
           const SInt32 n=OSIncrementAtomic(&vostroDPSeq);if(n>=480)return;
           auto root=IORegistryEntry::getRegistryRoot();if(!root)return;
           char key[24];snprintf(key,sizeof(key),"VostroDP%03d",(int)n);root->setProperty(key,line);
          }
          uint32_t XE::wrapDisplay13ReadAUX(void *port,uint32_t address,void *data,uint32_t length) {""")
          rep(""" const auto r=FunctionCast(wrapDisplay13ReadAUX,callbackXE->orgDisplay13ReadAUX)(port,address,data,length);""",
          """ const auto r=FunctionCast(wrapDisplay13ReadAUX,callbackXE->orgDisplay13ReadAUX)(port,address,data,length);
           vostroDP('R',port,address,data,length,r);""")
          rep(""" if(!ready)return kIOReturnNotReady;
           const auto r=FunctionCast(wrapDisplay13WriteAUX,callbackXE->orgDisplay13WriteAUX)(port,address,data,length);""",
          """ if(!ready){vostroDP('w',port,address,data,length,kIOReturnNotReady);return kIOReturnNotReady;}
           const auto r=FunctionCast(wrapDisplay13WriteAUX,callbackXE->orgDisplay13WriteAUX)(port,address,data,length);
           vostroDP('W',port,address,data,length,r);""")

          # 8) her sinyal ayarindan sonra donanim kayitlari (DDI_BUF_CTL, PHY lane gucu, DP_TP_CTL/STATUS)
          rep("""   if(selected.program([&](uint32_t r){return registers.read(r);},
                 [&](uint32_t r,uint32_t v){registers.write(r,v);} ))result=0;
            }""","""   if(selected.program([&](uint32_t r){return registers.read(r);},
                 [&](uint32_t r,uint32_t v){registers.write(r,v);} ))result=0;
             char rl[240];snprintf(rl,sizeof(rl),"G buf=%08x cl10=%08x func0=%08x tp0=%08x st0=%08x func1=%08x tp1=%08x st1=%08x rev=%d",
              registers.read(0x64000+0x100*ddi),registers.read(selected.base+0x28),registers.read(0x60400),registers.read(0x60540),registers.read(0x60544),
              registers.read(0x61400),registers.read(0x61540),registers.read(0x61544),(int)vostroLaneReverse);
             vostroDPLine(rl);
             snprintf(rl,sizeof(rl),"P clka=%08x en0=%08x c0=%08x/%08x en1=%08x c1=%08x/%08x dssm=%08x",
              registers.read(0x164280),registers.read(0x46010),registers.read(0x164284),registers.read(0x164288),
              registers.read(0x46014),registers.read(0x16428C),registers.read(0x164290),registers.read(0x51004));
             vostroDPLine(rl);
            }""")
          # 9) lane reversal knob (Linux icl_combo_phy_power_up_lanes: reversed x2 -> lane 1/0 kapat)
          rep("""  const auto vk=vostroKnobs();
            uint32_t vSw""","""  const auto vk=vostroKnobs();vostroLaneReverse=vk.rev;
            uint32_t vSw""")
          import os
          hp=os.path.join(os.path.dirname(path),"kern_tgl_combo_signal.hpp")
          h=open(hp).read()
          o1="""        const uint32_t laneMask=lanes==1?0xE0U:lanes==2?0xC0U:0;"""
          assert h.count(o1)==1
          h=h.replace(o1,"""        const uint32_t laneMask=lanes==1?(vostroLaneReverse?0x70U:0xE0U):lanes==2?(vostroLaneReverse?0x30U:0xC0U):0;""")
          o2="""            const bool load=linkRate!=30 && (n==1 || n==2 || (lanes==4 && n==3));"""
          assert h.count(o2)==1
          h=h.replace(o2,"""            const unsigned ln=vostroLaneReverse?3-n:n;
                      const bool load=linkRate!=30 && (ln==1 || ln==2 || (lanes==4 && ln==3));""")
          o3="struct TGLComboSignal {"
          assert h.count(o3)==1
          h=h.replace(o3,"inline volatile bool vostroLaneReverse=false;\n"+o3)
          open(hp,"w").write(h)

          # 10) ASSR (alternate scrambler reset) kapatma + tutarli TPS3: panel TPS4'te symbol lock alamiyor
          rep("""static void vostroDPLine(const char *line) {""","""#include <pexpert/pexpert.h>
          struct VostroDPKnobs {bool loaded;bool noassr;uint32_t tps;bool hbr;};
          static VostroDPKnobs vostroDPKnobs() {
           static VostroDPKnobs k {false,false,0,false};
           if(!k.loaded){uint32_t v=0;if(PE_parse_boot_argn("vostrotps",&v,sizeof(v)) && v>=1 && v<=3)k.tps=v;
            k.noassr=checkKernelArgument("-vostronoassr");k.hbr=checkKernelArgument("-vostrohbr");k.loaded=true;}
           return k;
          }
          static void vostroDPLine(const char *line) {""")
          rep(""" if(!ready){vostroDP('w',port,address,data,length,kIOReturnNotReady);return kIOReturnNotReady;}
           const auto r=FunctionCast(wrapDisplay13WriteAUX,callbackXE->orgDisplay13WriteAUX)(port,address,data,length);""",
          """ if(!ready){vostroDP('w',port,address,data,length,kIOReturnNotReady);return kIOReturnNotReady;}
           uint8_t vbuf[16];void *vdata=data;
           if(data && length>=1 && length<=16) {
            const auto dk=vostroDPKnobs();bool changed=false;memcpy(vbuf,data,length);
            if(dk.noassr && address<=0x10a && address+length>0x10a && (vbuf[0x10a-address]&1)){vbuf[0x10a-address]&=~1;changed=true;}
            if(dk.tps==3 && address<=0x102 && address+length>0x102 && (vbuf[0x102-address]&0xf)==7){vbuf[0x102-address]=0x23;changed=true;}
            if(changed){vdata=vbuf;vostroDPLine("VOSTRO dpcd yeniden yazildi (noassr/tps3)");}
           }
           const auto r=FunctionCast(wrapDisplay13WriteAUX,callbackXE->orgDisplay13WriteAUX)(port,address,vdata,length);""")
          rep(""" vostroDP('W',port,address,data,length,r);""",""" vostroDP('W',port,address,vdata,length,r);""")
          rep(""" if(valid)p[0x11A]&=p[0x10];
           IOLockUnlock(c.lock);
           if(!valid){vostroRecord(""",""" if(valid)p[0x11A]&=p[0x10];
           if(valid && vostroDPKnobs().noassr && p[0x118]){p[0x118]=0;vostroDPLine("VOSTRO kaynak ASSR kapatildi (p118=0)");}
           IOLockUnlock(c.lock);
           if(!valid){vostroRecord(""")

          # 11) panel max hizi: 0x0001=0x0a (HBR) ama 0x2201=0x14 (HBR2) ve 0x000E bit7=0 (genisletilmis alan YOK).
          #     BIOS/GOP paneli HBR x4 ile aciyor (0x100 = 0a 84). -vostrohbr: 0x2201'i 0x0a goster -> donor HBR x4 secer.
          rep(""" vostroDP('R',port,address,data,length,r);""",""" vostroDP('R',port,address,data,length,r);
           if(!r && data && vostroDPKnobs().hbr) {
            auto b=static_cast<uint8_t *>(data);bool changed=false;
            static const uint32_t vAddrs[2]={0x0001U,0x2201U};
            for(uint32_t i=0;i<2;i++){const uint32_t a=vAddrs[i];
             if(address<=a && address+length>a && b[a-address]>0x0a){b[a-address]=0x0a;changed=true;}}
            if(changed)vostroDPLine("VOSTRO max link rate HBR'a indirildi (vostrohbr)");
           }""")

          # 12) DPLL: Linux i915 (icl_dp_combo_pll + WA 22010492432) degerleriyle karsilastir, -vostropll ile duzelt
          rep("""uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {""","""static void vostroFixPLL(Display13FBSSTIO &io,uint32_t ddi,uint32_t rate,bool apply) {
           if(ddi>1)return;
           const uint32_t clka=io.read(0x164280);
           const uint32_t pll=(clka>>(ddi*2))&3,other=(clka>>((ddi^1)*2))&3;
           const bool otherOn=!(clka&(1U<<(10+(ddi^1))));
           if(pll>1){char l[96];snprintf(l,sizeof(l),"PLL ddi%u dpll%u desteklenmiyor clka=%08x",ddi,pll,clka);vostroDPLine(l);return;}
           const uint32_t en=0x46010+4*pll,c0=pll?0x16428C:0x164284,c1=pll?0x164290:0x164288;
           const uint32_t ref=io.read(0x51004)>>29; // 0=24 1=19.2 2=38.4
           uint32_t dcoInt,dcoFrac;
           if(ref==0){dcoInt=0x151;dcoFrac=0x4000;} else {dcoInt=0x1A5;dcoFrac=0x7000;}
           if(ref==2)dcoFrac=(dcoFrac+1)/2; // WA 22010492432
           uint32_t div;
           if(rate==20)div=(2U<<2)|(1U<<6); else if(rate==10)div=(2U<<2)|(2U<<6); else if(rate==6)div=(4U<<2)|(2U<<6); else div=0;
           const uint32_t v0=io.read(c0),v1=io.read(c1),ve=io.read(en);
           const uint32_t w0=(v0&0xFE000000U)|(dcoFrac<<10)|dcoInt,w1=div?((v1&~0x3FCU)|div):v1;
           char l[200];snprintf(l,sizeof(l),"PLL ddi%u dpll%u rate=%u ref=%u en=%08x cfgcr0=%08x->%08x cfgcr1=%08x->%08x shared=%d apply=%d",
            ddi,pll,rate,ref,ve,v0,w0,v1,w1,(int)(otherOn && other==pll),(int)apply);
           vostroDPLine(l);
           if(!apply || !div || (v0==w0 && v1==w1) || (otherOn && other==pll) || ref>2)return;
           io.write(0x164280,clka|(1U<<(10+ddi)));            // DDI saatini kapat
           const bool wasOn=(ve&0x80000000U)!=0;
           if(wasOn){io.write(en,ve&~0x80000000U);for(int i=0;i<200 && (io.read(en)&0x40000000U);i++)IODelay(10);}
           io.write(c0,w0);io.write(c1,w1);(void)io.read(c1);
           if(wasOn){io.write(en,io.read(en)|0x80000000U);for(int i=0;i<200 && !(io.read(en)&0x40000000U);i++)IODelay(10);}
           io.write(0x164280,clka);                            // eski durum
           snprintf(l,sizeof(l),"PLL yazildi en=%08x cfgcr0=%08x cfgcr1=%08x clka=%08x",io.read(en),io.read(c0),io.read(c1),io.read(0x164280));
           vostroDPLine(l);
          }
          uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {""")
          rep("""    if(pattern==1) {
               const auto r=XELP::SSTProgram::prepare(""","""    if(pattern==1) {
               vostroFixPLL(registers,binding.ddi,Display13FBMemory::field<uint32_t>(p,0x128),vostroKnobs().pll);
               const auto r=XELP::SSTProgram::prepare(""")
          open(path, "w").write(s)
          print("patched v11")
          PYEOF
          python3 wex_patch.py wex/WhateverXe/kern_xe.cpp
          ( cd wex && python3 tools/build.py --release --output build/RELEASE )
          K="$(find wex/build/RELEASE -type d -name WhateverXe.kext | head -1)"
          test -n "$K"
          strings "$K/Contents/MacOS/WhateverXe" | grep -q "vostropll"
          mkdir -p out && cp -R "$K" out/
      - uses: actions/upload-artifact@v4
        with:
          name: k-wex
          path: out/

  bt:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thegwchr/RealtekBluetoothFirmware
          path: rbf
          persist-credentials: false
      - name: Bluetooth yamasi + derle
        run: |
          cat > rbf_patch.py <<'PYEOF'
          #!/usr/bin/env python3
          """RealtekBluetoothFirmware yamasi: XYLog satirlarini IORegistry'ye de yaz + 0bda:c829 ekle."""
          import plistlib, copy, sys
          root = sys.argv[1]
          log = root + "/RealtekBluetoothFirmware/Log.h"
          s = open(log).read()
          old = '''#define XYLog(fmt, x...)\\
          do\\
          {\\
          IOLog("%s: " fmt, "RealtekFirmware", ##x);\\
          }while(0)'''
          assert s.count(old) == 1, "Log.h makrosu bulunamadi"
          new = '''#include <stdarg.h>
          #include <IOKit/IORegistryEntry.h>
          #include <libkern/OSAtomic.h>
          inline void vostroBTRecord(const char *fmt, ...) {
              static volatile SInt32 seq = 0;
              char line[240]; va_list ap; va_start(ap, fmt); vsnprintf(line, sizeof(line), fmt, ap); va_end(ap);
              for (char *c = line; *c; ++c) if (*c == '\\n') *c = ' ';
              const SInt32 n = OSIncrementAtomic(&seq);
              IORegistryEntry *r = IORegistryEntry::getRegistryRoot(); if (!r) return;
              char key[32];
              if (n < 64) { snprintf(key, sizeof(key), "VostroBT%02d", (int)n); r->setProperty(key, line); }
              r->setProperty("VostroBTLast", line);
          }
          #define XYLog(fmt, x...)\\
          do\\
          {\\
          IOLog("%s: " fmt, "RealtekFirmware", ##x);\\
          vostroBTRecord(fmt, ##x);\\
          }while(0)'''
          s = s.replace(old, new)
          open(log, "w").write(s)

          p = root + "/RealtekBluetoothFirmware/Info.plist"
          d = plistlib.load(open(p, "rb"))
          pers = d["IOKitPersonalities"]
          key = "RealtekBluetoothFirmware_0bda_c829"
          if key not in pers:
              tmpl = next(v for k, v in pers.items() if k.startswith("RealtekBluetoothFirmware_0bda_"))
              n = copy.deepcopy(tmpl); n["idVendor"] = 0x0bda; n["idProduct"] = 0xc829; pers[key] = n
          plistlib.dump(d, open(p, "wb"))

          # Sicak yeniden baslatma: firmware zaten yukluyse (lmp_subver tabloda yok) Linux btrtl gibi devam et
          bt = root + "/RealtekBluetoothFirmware/BtRtl.cpp"
          b = open(bt).read()
          old_b = """    m_icInfo = matchIc(ver.lmp_subver, ver.hci_rev, ver.hci_ver);
              if (!m_icInfo) {
                  XYLog("unsupported controller (lmp_subver %04x hci_rev %04x hci_ver %02x)\\n",
                        ver.lmp_subver, ver.hci_rev, ver.hci_ver);
                  return false;
              }"""
          new_b = """    m_icInfo = matchIc(ver.lmp_subver, ver.hci_rev, ver.hci_ver);
              if (!m_icInfo) {
                  XYLog("unsupported controller (lmp_subver %04x hci_rev %04x hci_ver %02x)\\n",
                        ver.lmp_subver, ver.hci_rev, ver.hci_ver);
                  XYLog("VOSTRO: assuming firmware already loaded, continuing\\n");
                  strlcpy(m_fwName, "preloaded", sizeof(m_fwName));
                  return true;
              }"""
          assert b.count(old_b) == 1, "BtRtl unsupported blogu bulunamadi"
          b = b.replace(old_b, new_b)
          open(bt, "w").write(b)
          print("rbf patched v2")
          PYEOF
          python3 rbf_patch.py rbf
          cd rbf && make
          codesign -f -s - build/RealtekBluetoothFirmware.kext
          mkdir -p ../out && cp -R build/RealtekBluetoothFirmware.kext ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: k-bt
          path: out/

  app:
    runs-on: macos-15
    steps:
      - name: Vostrointosh derle
        run: |
          mkdir -p src && cat > src/Vostrointosh.swift <<'SWEOF'
          // Vostrointosh - Dell Vostro 3520 Hackintosh menu bar araci (macOS 13 Ventura+)
          // Wi-Fi (rtw88ctl), ses cikisi secimi (CoreAudio), Bluetooth/ekran durumu, log alma.
          import SwiftUI
          import AppKit
          import CoreAudio

          // MARK: - Komut calistirma

          @discardableResult
          func shell(_ cmd: String, admin: Bool = false) -> (code: Int32, out: String) {
              let p = Process()
              if admin {
                  let esc = cmd.replacingOccurrences(of: "\\", with: "\\\\").replacingOccurrences(of: "\"", with: "\\\"")
                  p.executableURL = URL(fileURLWithPath: "/usr/bin/osascript")
                  p.arguments = ["-e", "do shell script \"\(esc)\" with administrator privileges"]
              } else {
                  p.executableURL = URL(fileURLWithPath: "/bin/bash")
                  p.arguments = ["-c", cmd]
              }
              var env = ProcessInfo.processInfo.environment
              env["PATH"] = "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:" + (env["PATH"] ?? "")
              p.environment = env
              let pipe = Pipe()
              p.standardOutput = pipe
              p.standardError = pipe
              do { try p.run() } catch { return (-1, "\(error)") }
              let data = pipe.fileHandleForReading.readDataToEndOfFile()
              p.waitUntilExit()
              return (p.terminationStatus, String(data: data, encoding: .utf8) ?? "")
          }

          func q(_ s: String) -> String { "'" + s.replacingOccurrences(of: "'", with: "'\\''") + "'" }

          // MARK: - Wi-Fi (rtw88ctl)

          struct WiFiNet: Identifiable, Hashable {
              let id: String
              let ssid: String
              let rssi: Int
          }

          final class WiFiModel: ObservableObject {
              @Published var nets: [WiFiNet] = []
              @Published var status: [String: String] = [:]
              @Published var busy = false
              @Published var message = ""
              let tool = "rtw88ctl"

              var connectedSSID: String? {
                  guard let s = status["SSID"], s != "(unknown)", !s.isEmpty else { return nil }
                  return (status["State"] ?? "").contains("connected") ? s : nil
              }
              var powerOn: Bool { (status["Power"] ?? "on").contains("on") }
              var rssi: Int? { Int((status["RSSI"] ?? "").components(separatedBy: " ").first ?? "") }

              func run(_ args: String, then: ((String) -> Void)? = nil) {
                  busy = true
                  DispatchQueue.global().async {
                      var r = shell("\(self.tool) \(args)")
                      if r.code != 0 && (r.out.contains("ermission") || r.out.contains("privilege") || r.out.contains("0xe00002c1")) {
                          r = shell("/usr/local/bin/\(self.tool) \(args)", admin: true)
                      }
                      DispatchQueue.main.async {
                          self.busy = false
                          if r.code == -1 || r.out.contains("command not found") {
                              self.message = "rtw88ctl bulunamadi (/usr/local/bin)"
                          }
                          then?(r.out)
                      }
                  }
              }

              func refreshStatus() {
                  run("status") { out in
                      var d: [String: String] = [:]
                      for line in out.split(separator: "\n") {
                          guard let i = line.firstIndex(of: ":") else { continue }
                          let k = line[..<i].trimmingCharacters(in: .whitespaces)
                          let v = line[line.index(after: i)...].trimmingCharacters(in: .whitespaces)
                          d[k] = v
                      }
                      self.status = d
                  }
              }

              func scan() {
                  message = "Taraniyor..."
                  run("scan -w 6") { out in
                      self.nets = WiFiModel.parse(out)
                      self.message = self.nets.isEmpty ? "Ag bulunamadi" : ""
                  }
              }

              // "SSID  BSSID  RSSI" tablosu: BSSID'yi bul, oncesi SSID, sonrasindaki ilk sayi RSSI
              static func parse(_ out: String) -> [WiFiNet] {
                  var best: [String: WiFiNet] = [:]
                  let mac = try! NSRegularExpression(pattern: "([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}")
                  for raw in out.split(separator: "\n") {
                      let line = String(raw)
                      let ns = line as NSString
                      guard let m = mac.firstMatch(in: line, range: NSRange(location: 0, length: ns.length)) else { continue }
                      let ssid = ns.substring(to: m.range.location).trimmingCharacters(in: .whitespaces)
                      let rest = ns.substring(from: m.range.location + m.range.length)
                      let rssi = rest.split(whereSeparator: { $0 == " " || $0 == "\t" }).compactMap { Int($0) }.first ?? -100
                      guard !ssid.isEmpty, ssid != "SSID" else { continue }
                      if let old = best[ssid], old.rssi >= rssi { continue }
                      best[ssid] = WiFiNet(id: ssid, ssid: ssid, rssi: rssi)
                  }
                  return best.values.sorted { $0.rssi > $1.rssi }
              }

              func connect(_ ssid: String, _ pass: String) {
                  message = "\(ssid) baglaniyor..."
                  let cmd = pass.isEmpty ? "connect \(q(ssid))" : "connect \(q(ssid)) \(q(pass))"
                  run(cmd) { out in
                      self.message = out.contains("Connected") ? "Baglandi" : "Baglanamadi"
                      if out.contains("Connected") { Keychain.save(ssid: ssid, pass: pass) }
                      self.refreshStatus()
                  }
              }
              func disconnect() { run("disconnect") { _ in self.refreshStatus() } }
              func power(_ on: Bool) { run("power \(on ? "on" : "off")") { _ in self.refreshStatus() } }

              // Acilista bilinen aga otomatik baglan
              func autoJoin() {
                  run("status") { out in
                      if out.contains("connected") && !out.contains("disconnected") { self.refreshStatus(); return }
                      self.run("scan -w 6") { list in
                          self.nets = WiFiModel.parse(list)
                          for n in self.nets { if let p = Keychain.load(ssid: n.ssid) { self.connect(n.ssid, p); return } }
                          self.refreshStatus()
                      }
                  }
              }
          }

          // Sifreler kullanicinin anahtar zincirinde
          enum Keychain {
              static let service = "Vostrointosh.WiFi"
              static func save(ssid: String, pass: String) {
                  let base: [String: Any] = [kSecClass as String: kSecClassGenericPassword,
                                             kSecAttrService as String: service, kSecAttrAccount as String: ssid]
                  SecItemDelete(base as CFDictionary)
                  var add = base; add[kSecValueData as String] = pass.data(using: .utf8)!
                  SecItemAdd(add as CFDictionary, nil)
              }
              static func load(ssid: String) -> String? {
                  let qd: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service,
                                           kSecAttrAccount as String: ssid, kSecReturnData as String: true,
                                           kSecMatchLimit as String: kSecMatchLimitOne]
                  var item: CFTypeRef?
                  guard SecItemCopyMatching(qd as CFDictionary, &item) == errSecSuccess, let d = item as? Data else { return nil }
                  return String(data: d, encoding: .utf8)
              }
          }

          // MARK: - Ses cikisi (CoreAudio)

          struct AudioDev: Identifiable, Hashable { let id: AudioDeviceID; let name: String }

          final class AudioModel: ObservableObject {
              @Published var outputs: [AudioDev] = []
              @Published var current: AudioDeviceID = 0

              func refresh() {
                  var addr = AudioObjectPropertyAddress(mSelector: kAudioHardwarePropertyDevices,
                                                        mScope: kAudioObjectPropertyScopeGlobal,
                                                        mElement: kAudioObjectPropertyElementMain)
                  var size: UInt32 = 0
                  guard AudioObjectGetPropertyDataSize(AudioObjectID(kAudioObjectSystemObject), &addr, 0, nil, &size) == noErr else { return }
                  var ids = [AudioDeviceID](repeating: 0, count: Int(size) / MemoryLayout<AudioDeviceID>.size)
                  guard AudioObjectGetPropertyData(AudioObjectID(kAudioObjectSystemObject), &addr, 0, nil, &size, &ids) == noErr else { return }
                  outputs = ids.filter { AudioModel.hasOutput($0) }.map { AudioDev(id: $0, name: AudioModel.name($0)) }
                  current = AudioModel.defaultOutput()
              }

              static func hasOutput(_ id: AudioDeviceID) -> Bool {
                  var addr = AudioObjectPropertyAddress(mSelector: kAudioDevicePropertyStreamConfiguration,
                                                        mScope: kAudioDevicePropertyScopeOutput,
                                                        mElement: kAudioObjectPropertyElementMain)
                  var size: UInt32 = 0
                  guard AudioObjectGetPropertyDataSize(id, &addr, 0, nil, &size) == noErr, size > 0 else { return false }
                  let raw = UnsafeMutableRawPointer.allocate(byteCount: Int(size), alignment: MemoryLayout<AudioBufferList>.alignment)
                  defer { raw.deallocate() }
                  guard AudioObjectGetPropertyData(id, &addr, 0, nil, &size, raw) == noErr else { return false }
                  let list = UnsafeMutableAudioBufferListPointer(raw.assumingMemoryBound(to: AudioBufferList.self))
                  return list.reduce(0) { $0 + Int($1.mNumberChannels) } > 0
              }

              static func name(_ id: AudioDeviceID) -> String {
                  var addr = AudioObjectPropertyAddress(mSelector: kAudioObjectPropertyName,
                                                        mScope: kAudioObjectPropertyScopeGlobal,
                                                        mElement: kAudioObjectPropertyElementMain)
                  var name: Unmanaged<CFString>?
                  var size = UInt32(MemoryLayout<Unmanaged<CFString>?>.size)
                  guard AudioObjectGetPropertyData(id, &addr, 0, nil, &size, &name) == noErr, let n = name else { return "Cihaz \(id)" }
                  return n.takeRetainedValue() as String
              }

              static func defaultOutput() -> AudioDeviceID {
                  var addr = AudioObjectPropertyAddress(mSelector: kAudioHardwarePropertyDefaultOutputDevice,
                                                        mScope: kAudioObjectPropertyScopeGlobal,
                                                        mElement: kAudioObjectPropertyElementMain)
                  var id: AudioDeviceID = 0
                  var size = UInt32(MemoryLayout<AudioDeviceID>.size)
                  AudioObjectGetPropertyData(AudioObjectID(kAudioObjectSystemObject), &addr, 0, nil, &size, &id)
                  return id
              }

              func select(_ id: AudioDeviceID) {
                  for sel in [kAudioHardwarePropertyDefaultOutputDevice, kAudioHardwarePropertyDefaultSystemOutputDevice] {
                      var addr = AudioObjectPropertyAddress(mSelector: sel, mScope: kAudioObjectPropertyScopeGlobal,
                                                            mElement: kAudioObjectPropertyElementMain)
                      var dev = id
                      AudioObjectSetPropertyData(AudioObjectID(kAudioObjectSystemObject), &addr, 0, nil,
                                                 UInt32(MemoryLayout<AudioDeviceID>.size), &dev)
                  }
                  refresh()
              }
          }

          // MARK: - Sistem durumu (ekran / bluetooth / usb)

          struct StatusLine: Identifiable { let id: String; let value: String }

          final class SystemModel: ObservableObject {
              @Published var lines: [StatusLine] = []
              @Published var logMsg = ""

              func refresh() {
                  DispatchQueue.global().async {
                      var r: [StatusLine] = []
                      let combo = shell("ioreg -lw0 -d 1 | grep -E '\"VostroComboLast\"' | sed 's/.*= //'").out
                          .trimmingCharacters(in: .whitespacesAndNewlines)
                      r.append(StatusLine(id: "Laptop ekrani", value: combo.contains("result=0\"") ? "ACIK" : (combo.isEmpty ? "bilgi yok" : "egitim basarisiz")))
                      let bt = shell("system_profiler SPBluetoothDataType 2>/dev/null | grep -E 'State:|Address:' | head -2").out
                      r.append(StatusLine(id: "Bluetooth", value: bt.contains("On") ? "acik" : (bt.contains("NULL") ? "kart yanit vermiyor" : "kapali")))
                      let usbAudio = shell("system_profiler SPAudioDataType 2>/dev/null | grep -c 'Transport: USB'").out
                          .trimmingCharacters(in: .whitespacesAndNewlines)
                      r.append(StatusLine(id: "USB ses cihazi", value: (Int(usbAudio) ?? 0) > 0 ? "\(usbAudio) adet" : "yok"))
                      let d = shell("cat /Volumes/1401/vostro_durum/bitti.txt /Volumes/1401/vostro_durum/siradaki.txt 2>/dev/null | head -1").out
                          .trimmingCharacters(in: .whitespacesAndNewlines)
                      if !d.isEmpty { r.append(StatusLine(id: "Ekran denemesi", value: d)) }
                      DispatchQueue.main.async { self.lines = r }
                  }
              }

              func takeLog() {
                  logMsg = "Log aliniyor..."
                  DispatchQueue.global().async {
                      let r = shell("bash /usr/local/vostro/vostro_log.sh", admin: true)
                      DispatchQueue.main.async {
                          self.logMsg = r.code == 0 ? "Log 1401/vostro_combo.txt'ye yazildi" : "Log alinamadi"
                          if r.code == 0 { NSWorkspace.shared.selectFile("/Volumes/1401/vostro_combo.txt", inFileViewerRootedAtPath: "") }
                      }
                  }
              }

              // Ventura: Kontrol Merkezi'ndeki yerel Wi-Fi simgesini gizle/goster
              func nativeWiFiIcon(show: Bool) {
                  shell("defaults write com.apple.controlcenter 'NSStatusItem Visible WiFi' -bool \(show ? "true" : "false"); killall ControlCenter")
              }
          }

          // MARK: - Arayuz

          struct WiFiRow: View {
              let net: WiFiNet
              let connected: Bool
              let onTap: () -> Void
              var bars: String { net.rssi > -55 ? "wifi" : (net.rssi > -70 ? "wifi" : "wifi.exclamationmark") }
              var body: some View {
                  Button(action: onTap) {
                      HStack {
                          Image(systemName: bars).frame(width: 18)
                          Text(net.ssid).lineLimit(1)
                          Spacer()
                          if connected { Image(systemName: "checkmark").foregroundColor(.accentColor) }
                          Text("\(net.rssi)").font(.caption).foregroundColor(.secondary)
                      }.contentShape(Rectangle())
                  }.buttonStyle(.plain).padding(.vertical, 2)
              }
          }

          struct MenuView: View {
              @ObservedObject var wifi: WiFiModel
              @ObservedObject var audio: AudioModel
              @ObservedObject var sys: SystemModel
              @State private var pickSSID: String?
              @State private var pass = ""

              var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      HStack {
                          Text("Wi-Fi").font(.headline)
                          Spacer()
                          Toggle("", isOn: Binding(get: { wifi.powerOn }, set: { wifi.power($0) }))
                              .toggleStyle(.switch).labelsHidden()
                      }
                      if let s = wifi.connectedSSID {
                          HStack {
                              Image(systemName: "wifi").foregroundColor(.accentColor)
                              Text(s).bold()
                              Spacer()
                              Button("Kes") { wifi.disconnect() }
                          }
                      }
                      HStack {
                          Text("Diger aglar").font(.caption).foregroundColor(.secondary)
                          Spacer()
                          if wifi.busy { ProgressView().controlSize(.small) }
                          Button { wifi.scan() } label: { Image(systemName: "arrow.clockwise") }.buttonStyle(.borderless)
                      }
                      ScrollView {
                          VStack(alignment: .leading, spacing: 0) {
                              ForEach(wifi.nets) { n in
                                  WiFiRow(net: n, connected: n.ssid == wifi.connectedSSID) {
                                      if let saved = Keychain.load(ssid: n.ssid) { wifi.connect(n.ssid, saved) }
                                      else { pickSSID = n.ssid; pass = "" }
                                  }
                              }
                          }
                      }.frame(maxHeight: 180)
                      if let s = pickSSID {
                          VStack(alignment: .leading) {
                              Text("\"\(s)\" sifresi").font(.caption)
                              SecureField("Sifre (acik ag icin bos)", text: $pass)
                              HStack {
                                  Button("Vazgec") { pickSSID = nil }
                                  Spacer()
                                  Button("Baglan") { wifi.connect(s, pass); pickSSID = nil }.keyboardShortcut(.defaultAction)
                              }
                          }
                      }
                      if !wifi.message.isEmpty { Text(wifi.message).font(.caption).foregroundColor(.secondary) }

                      Divider()
                      Text("Ses cikisi").font(.headline)
                      if audio.outputs.isEmpty {
                          Text("Ses cihazi yok. USB ses karti ya da Bluetooth hoparlor tak.").font(.caption).foregroundColor(.secondary)
                      }
                      ForEach(audio.outputs) { d in
                          Button { audio.select(d.id) } label: {
                              HStack {
                                  Image(systemName: d.id == audio.current ? "speaker.wave.2.fill" : "speaker")
                                  Text(d.name)
                                  Spacer()
                                  if d.id == audio.current { Image(systemName: "checkmark") }
                              }.contentShape(Rectangle())
                          }.buttonStyle(.plain)
                      }

                      Divider()
                      Text("Vostro 3520 durumu").font(.headline)
                      ForEach(sys.lines) { l in
                          HStack { Text(l.id).foregroundColor(.secondary); Spacer(); Text(l.value).lineLimit(2).multilineTextAlignment(.trailing) }
                              .font(.caption)
                      }
                      HStack {
                          Button("Log al") { sys.takeLog() }
                          Button("Bluetooth ayarlari") {
                              NSWorkspace.shared.open(URL(string: "x-apple.systempreferences:com.apple.BluetoothSettings")!)
                          }
                      }
                      if !sys.logMsg.isEmpty { Text(sys.logMsg).font(.caption).foregroundColor(.secondary) }
                      Menu("Diger") {
                          Button("Yerel Wi-Fi simgesini gizle") { sys.nativeWiFiIcon(show: false) }
                          Button("Yerel Wi-Fi simgesini goster") { sys.nativeWiFiIcon(show: true) }
                          Button("Acilista calistir") {
                              shell("osascript -e 'tell application \"System Events\" to make login item at end with properties {path:\"\(Bundle.main.bundlePath)\", hidden:true}'")
                          }
                          Divider()
                          Button("Cikis") { NSApp.terminate(nil) }
                      }
                  }
                  .padding(12)
                  .frame(width: 300)
                  .onAppear { wifi.refreshStatus(); audio.refresh(); sys.refresh(); if wifi.nets.isEmpty { wifi.scan() } }
              }
          }

          @main
          struct VostrointoshApp: App {
              @StateObject var wifi: WiFiModel
              @StateObject var audio = AudioModel()
              @StateObject var sys = SystemModel()

              init() {
                  let w = WiFiModel()
                  _wifi = StateObject(wrappedValue: w)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 3) { w.autoJoin() }
              }

              var icon: String {
                  if !wifi.powerOn { return "wifi.slash" }
                  return wifi.connectedSSID == nil ? "wifi.exclamationmark" : "wifi"
              }

              var body: some Scene {
                  MenuBarExtra {
                      MenuView(wifi: wifi, audio: audio, sys: sys)
                  } label: {
                      Image(systemName: icon)
                  }
                  .menuBarExtraStyle(.window)
              }
          }
          SWEOF
          swiftc -parse-as-library -O -target x86_64-apple-macos13.0 src/Vostrointosh.swift -o Vostrointosh \
            -framework SwiftUI -framework AppKit -framework CoreAudio -framework Security
          A=out/Vostrointosh.app/Contents; mkdir -p $A/MacOS && cp Vostrointosh $A/MacOS/
          cat > $A/Info.plist <<'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
