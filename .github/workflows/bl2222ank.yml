           io.write(0x16428C,sc0);io.write(0x164290,sc1);(void)io.read(0x164290);
           io.write(0x46014,io.read(0x46014)|0x80000000U);for(int i=0;i<200 && !(io.read(0x46014)&0x40000000U);i++)IODelay(10);
           io.write(0x164280,(io.read(0x164280)&~3U)|1U|(1U<<10));            // DDI A -> DPLL1 (hala kapali)
