           char l[200];snprintf(l,sizeof(l),"DPLL1 secildi: en1=%08x c1=%08x/%08x clka=%08x (onceki clka=%08x)",
            io.read(0x46014),io.read(0x16428C),io.read(0x164290),io.read(0x164280),clka);
           vostroDPLine(l);
          }
          uint32_t XE::wrapDisplay13TrainingPattern(void *path,uint32_t pattern) {""")
          rep("""     vostroFixPLL(registers,binding.ddi,Display13FBMemory::field<uint32_t>(p,0x128),vostroKnobs().pll);""",
          """     vostroFixPLL(registers,binding.ddi,Display13FBMemory::field<uint32_t>(p,0x128),vostroKnobs().pll);
