              }""")
          rep("""   char rl[240];snprintf(rl,sizeof(rl),"G buf=""","""   if(result==0 && vk.gop && vostroGOP.valid && ddi==0) {
              const uint32_t b=selected.base;const auto &g=vostroGOP;
              const uint32_t d5=registers.read(b+0x894);registers.write(b+0x694,d5&~0x80000000U);
              for(unsigned n=0;n<4;++n) {
               registers.write(b+0x888+0x100*n,(registers.read(b+0x888+0x100*n)&~0xB8FFU)|(g.dw2[n]&0xB8FFU));
               registers.write(b+0x890+0x100*n,(registers.read(b+0x890+0x100*n)&~0x8003FFFFU)|(g.dw4[n]&0x8003FFFFU));
               registers.write(b+0x89C+0x100*n,(registers.read(b+0x89C+0x100*n)&~0x7F000000U)|(g.dw7[n]&0x7F000000U));
              }
              registers.write(b+0x694,d5|0x80000000U);
              vostroDPLine("GOP PHY seviyeleri uygulandi (vostrogop)");
             }
