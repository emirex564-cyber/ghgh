# Vostro 3520 - RTL88WiFi (X1REN41L) + Ventura yigin tasmasi duzeltmesi
# Kullanim: repo > .github/workflows/rtl88wifi.yml > Actions > RTL88WiFi Vostro > Run workflow
name: RTL88WiFi Vostro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Kaynak
        run: |
          git clone -q https://github.com/X1REN41L/RTL8821CE-macOS src
          cd src && git log -1 --format='%h %ci %s'
      - name: Vostro yamasi - SCAN_DONE ertele
        run: |
          echo '' | base64 -d > /tmp/rtlpatch.py
          python3 /tmp/rtlpatch.py src/driver/RTL88WiFi/src/kext/RTL88WiFi.cpp
          grep -n "vostroDeferScanDone" src/driver/RTL88WiFi/src/kext/RTL88WiFi.cpp
      - name: Derle
        run: |
          cd src/driver/RTL88WiFi
          make rtl88wifi 2>&1 | tail -30
          ls -la build/out
      - uses: actions/upload-artifact@v4
        with:
          name: rtl88wifi
          path: src/driver/RTL88WiFi/build/out/
